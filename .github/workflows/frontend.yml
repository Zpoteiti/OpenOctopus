name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "docs/API.yaml"
      - "server/**"
      - "Dockerfile"
      - "compose.yaml"
      - ".env.example"
      - ".dockerignore"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "docs/API.yaml"
      - "server/**"
      - "Dockerfile"
      - "compose.yaml"
      - ".env.example"
      - ".dockerignore"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  test:
    name: linux-node24
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: openoctopus
          POSTGRES_PASSWORD: octopus
          POSTGRES_DB: openoctopus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openoctopus -d openoctopus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify generated OpenAPI types
        working-directory: frontend
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/openapi.d.ts

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Install Server test dependencies
        working-directory: server
        run: python -m pip install -e ".[dev]"

      - name: Prepare Server test configuration
        working-directory: server
        run: cp .env.example .env

      - name: Test same-origin SPA hosting
        working-directory: server
        run: python -m pytest -q tests/test_frontend_static.py

      - name: Start RustFS and create workspace bucket
        working-directory: server
        run: |
          docker run -d --name openoctopus-rustfs \
            -p 9000:9000 -p 9001:9001 \
            -e RUSTFS_ACCESS_KEY=openoctopus \
            -e RUSTFS_SECRET_KEY=change-me-object-storage-secret \
            rustfs/rustfs@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21 \
            /data
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              docker logs openoctopus-rustfs
              exit 1
            fi
            sleep 1
          done
          python -c "from minio import Minio; Minio('localhost:9000', access_key='openoctopus', secret_key='change-me-object-storage-secret', secure=False).make_bucket('openoctopus')"

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke test
        working-directory: frontend
        run: npm run e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  image:
    name: server-image
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build Server image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: openoctopus:frontend-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify packaged frontend
        run: >-
          docker run --rm --entrypoint python openoctopus:frontend-ci -c
          "from pathlib import Path; import openctopus_server;
          root = Path(openctopus_server.__file__).parent / 'assets' / 'web';
          assert (root / 'index.html').is_file();
          assert any((root / 'assets').iterdir())"

      - name: Verify non-root runtime
        run: |
          runtime_uid="$(docker run --rm --entrypoint id openoctopus:frontend-ci -u)"
          test "$runtime_uid" = "10001"

      - name: Start image dependencies and verify published health
        run: |
          OPENOCTOPUS_IMAGE=openoctopus:frontend-ci \
            docker compose --env-file .env.example up --detach --no-build --wait
          curl --fail --silent --show-error http://127.0.0.1:8080/health

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs --no-color

      - name: Stop Compose stack
        if: always()
        run: docker compose --env-file .env.example down --volumes
