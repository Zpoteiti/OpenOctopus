name: Python Client CI

on:
  workflow_call:
    inputs:
      run_platform_matrix:
        description: Build and test the native client packages on every platform
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  frozen-smoke:
    name: linux-x64
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: client/pyproject.toml

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev,build]"

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy --strict src tests

      - name: Test
        run: python -m pytest -v

      - name: Build one-folder bundle
        run: python -m PyInstaller --noconfirm --clean openoctopus_client.spec

      - name: Smoke test frozen bundle against document corpus
        env:
          OO_CLIENT_BIN: ${{ github.workspace }}/client/dist/openoctopus-client/openoctopus-core
          OO_DOCUMENT_CORPUS: ${{ github.workspace }}/server/tests/fixtures/documents
        run: |
          set -o pipefail
          mkdir -p metrics
          python tests/frozen_smoke.py | tee metrics/frozen-smoke.json

      - name: Smoke test frozen runtime, private core pipe, and tray
        env:
          OO_CLIENT_BIN: ${{ github.workspace }}/client/dist/openoctopus-client/openoctopus-core
          OO_DOCUMENT_CORPUS: ${{ github.workspace }}/server/tests/fixtures/documents
        run: |
          set -o pipefail
          python tests/frozen_runtime_smoke.py | tee metrics/frozen-runtime-smoke.json

      - name: Build Debian installer
        run: bash packaging/build_deb.sh dist/openoctopus-client 0.0.1 release

      - name: Upload Debian installer
        uses: actions/upload-artifact@v7
        with:
          name: openoctopus-client-linux-x64-deb
          path: client/release/openoctopus-client_0.0.1_amd64.deb
          if-no-files-found: error

      - name: Upload smoke metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openoctopus-client-linux-x64-metrics
          path: client/metrics
          if-no-files-found: warn

  macos-native:
    if: ${{ inputs.run_platform_matrix }}
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    defaults:
      run:
        working-directory: client
        shell: bash

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: client/pyproject.toml

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev,build]"

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy --strict src tests

      - name: Test
        run: python -m pytest -v

      - name: Build native one-folder bundle
        run: python -m PyInstaller --noconfirm --clean openoctopus_client.spec

      - name: Smoke test native frozen bundle
        env:
          OO_CLIENT_BIN: ${{ github.workspace }}/client/dist/openoctopus-client/openoctopus-core
          OO_DOCUMENT_CORPUS: ${{ github.workspace }}/server/tests/fixtures/documents
        run: |
          set -o pipefail
          mkdir -p metrics
          python tests/frozen_smoke.py | tee metrics/frozen-smoke.json

      - name: Smoke test native frozen runtime
        env:
          OO_CLIENT_BIN: ${{ github.workspace }}/client/dist/openoctopus-client/openoctopus-core
          OO_DOCUMENT_CORPUS: ${{ github.workspace }}/server/tests/fixtures/documents
        run: |
          set -o pipefail
          python tests/frozen_runtime_smoke.py | tee metrics/frozen-runtime-smoke.json

      - name: Build disk image
        run: bash packaging/build_dmg.sh "dist/OpenOctopus Client.app" 0.0.1 release

      - name: Verify the application inside the disk image
        run: |
          mkdir -p dmg-mount
          hdiutil attach release/OpenOctopusClient-0.0.1-${{ matrix.arch }}.dmg -readonly -nobrowse -mountpoint "$PWD/dmg-mount"
          trap 'hdiutil detach "$PWD/dmg-mount"' EXIT
          APP="$PWD/dmg-mount/OpenOctopus Client.app"
          test -f "$APP/Contents/MacOS/openoctopus-client"
          /usr/libexec/PlistBuddy -c 'Print LSUIElement' "$APP/Contents/Info.plist" | grep -qx true
          OO_CLIENT_BIN="$APP/Contents/MacOS/openoctopus-core" \
            OO_DOCUMENT_CORPUS="${{ github.workspace }}/server/tests/fixtures/documents" \
            python tests/frozen_runtime_smoke.py

      - name: Upload disk image
        uses: actions/upload-artifact@v7
        with:
          name: openoctopus-client-macos-${{ matrix.arch }}-dmg
          path: client/release/OpenOctopusClient-0.0.1-${{ matrix.arch }}.dmg
          if-no-files-found: error

      - name: Upload native smoke metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openoctopus-client-macos-${{ matrix.arch }}-metrics
          path: client/metrics
          if-no-files-found: warn

  windows-native:
    if: ${{ inputs.run_platform_matrix }}
    name: windows-x64
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        working-directory: client
        shell: pwsh

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: client/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,build]"

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy --strict src tests

      - name: Test, including native Windows process contracts
        run: python -m pytest -v

      - name: Build native one-folder bundle
        run: python -m PyInstaller --noconfirm --clean openoctopus_client.spec

      - name: Smoke test native frozen bundle
        env:
          OO_CLIENT_BIN: ${{ github.workspace }}/client/dist/openoctopus-client/openoctopus-core.exe
          OO_DOCUMENT_CORPUS: ${{ github.workspace }}/server/tests/fixtures/documents
        run: |
          New-Item -ItemType Directory -Force -Path metrics | Out-Null
          python tests/frozen_smoke.py | Tee-Object -FilePath metrics/frozen-smoke.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test native frozen runtime
        env:
          OO_CLIENT_BIN: ${{ github.workspace }}/client/dist/openoctopus-client/openoctopus-core.exe
          OO_DOCUMENT_CORPUS: ${{ github.workspace }}/server/tests/fixtures/documents
        run: |
          python tests/frozen_runtime_smoke.py | Tee-Object -FilePath metrics/frozen-runtime-smoke.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build per-user Windows installer
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "${env:ProgramFiles(x86)}\NSIS;$env:PATH"
          python packaging\build_windows_installer.py dist\openoctopus-client 0.0.1 release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: openoctopus-client-windows-x64-installer
          path: client/release/OpenOctopusClient-Setup-0.0.1-per-user.exe
          if-no-files-found: error

      - name: Verify per-user install and uninstall
        run: |
          $target = Join-Path $env:LOCALAPPDATA 'Programs\OpenOctopusClient'
          $installer = Resolve-Path 'release\OpenOctopusClient-Setup-0.0.1-per-user.exe'
          $process = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installer failed' }
          if (!(Test-Path "$target\openoctopus-client.exe")) { throw 'Tray executable missing' }
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'OpenOctopus Client\OpenOctopus Client.lnk'
          if (!(Test-Path $shortcut)) { throw 'Start Menu shortcut missing' }
          $run = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          if ($run.PSObject.Properties.Name -contains 'OpenOctopus Client') { throw 'Autostart must default off' }
          $env:OO_CLIENT_BIN = "$target\openoctopus-core.exe"
          $env:OO_DOCUMENT_CORPUS = '${{ github.workspace }}\server\tests\fixtures\documents'
          python tests/frozen_runtime_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $process = Start-Process "$target\Uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Uninstaller failed' }
          if (Test-Path "$target\openoctopus-client.exe") { throw 'Tray executable not removed' }
          if (Test-Path $shortcut) { throw 'Start Menu shortcut not removed' }

      - name: Upload native smoke metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openoctopus-client-windows-x64-metrics
          path: client/metrics
          if-no-files-found: warn

  frozen-device-e2e:
    name: linux-x64-device-e2e
    needs: frozen-smoke
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: openoctopus
          POSTGRES_PASSWORD: octopus
          POSTGRES_DB: openoctopus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openoctopus -d openoctopus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download Debian installer
        uses: actions/download-artifact@v7
        with:
          name: openoctopus-client-linux-x64-deb
          path: client/release

      - name: Extract the executable bundle from the installer
        run: |
          mkdir -p ../client/release/extract ../client/dist
          dpkg-deb -x ../client/release/openoctopus-client_0.0.1_amd64.deb \
            ../client/release/extract
          cp -a ../client/release/extract/opt/OpenOctopus/openoctopus-client \
            ../client/dist/openoctopus-client

      - name: Install server dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Create environment file
        run: cp .env.example .env

      - name: Start RustFS and create workspace bucket
        run: |
          docker run -d --name openoctopus-rustfs \
            -p 9000:9000 -p 9001:9001 \
            -e RUSTFS_ACCESS_KEY=openoctopus \
            -e RUSTFS_SECRET_KEY=change-me-object-storage-secret \
            rustfs/rustfs@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21 \
            /data
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              docker logs openoctopus-rustfs
              exit 1
            fi
            sleep 1
          done
          python -c "from minio import Minio; Minio('localhost:9000', access_key='openoctopus', secret_key='change-me-object-storage-secret', secure=False).make_bucket('openoctopus')"

      - name: Run frozen device, MCP, tool, transfer, and relay E2E
        env:
          OO_CLIENT_BIN: ${{ github.workspace }}/client/dist/openoctopus-client/openoctopus-core
          PY5_REAL_E2E: "1"
          PY6_REAL_E2E: "1"
          PY7_REAL_E2E: "1"
          PY8C_REAL_E2E: "1"
        run: |
          chmod +x "$OO_CLIENT_BIN"
          test -x "$OO_CLIENT_BIN"
          pytest -v \
            tests/test_device_client_e2e.py::test_real_chat_runtime_source_client_read_write_and_offline \
            tests/test_device_client_transfer_e2e.py::test_real_file_transfer_and_device_workspace_relay \
            tests/test_device_client_transfer_e2e.py::test_real_distinct_clients_copy_move_and_failure_contracts \
            tests/test_py6_client_exec_e2e.py::test_real_client_exec_pipe_tty_reconnect_and_chat_isolation \
            tests/test_py7_client_mcp_e2e.py::test_real_client_validates_registers_and_runs_all_mcp_surfaces \
            tests/test_py8c_directory_transfer_e2e.py::test_real_rustfs_and_two_clients_cover_all_directory_directions
