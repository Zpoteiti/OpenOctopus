name: Python Server CI

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "client/**"
      - "docs/API.yaml"
      - ".github/workflows/py-server.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "client/**"
      - "docs/API.yaml"
      - ".github/workflows/py-server.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: openoctopus
          POSTGRES_PASSWORD: octopus
          POSTGRES_DB: openoctopus
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create environment file
        run: cp .env.example .env

      - name: Validate static OpenAPI document
        run: |
          python - <<'PY'
          from pathlib import Path

          import yaml

          path = Path("../docs/API.yaml")
          document = yaml.safe_load(path.read_text(encoding="utf-8"))
          if not isinstance(document, dict) or document.get("openapi") != "3.1.0":
              raise SystemExit("docs/API.yaml is not an OpenAPI 3.1 document")

          def check_refs(value: object) -> None:
              if isinstance(value, dict):
                  ref = value.get("$ref")
                  if isinstance(ref, str) and ref.startswith("#/"):
                      target: object = document
                      for part in ref[2:].split("/"):
                          if not isinstance(target, dict) or part not in target:
                              raise SystemExit(f"unresolved local OpenAPI $ref: {ref}")
                          target = target[part]
                  for child in value.values():
                      check_refs(child)
              elif isinstance(value, list):
                  for child in value:
                      check_refs(child)

          check_refs(document)
          print(f"validated {path}")
          PY

      - name: Start RustFS and create workspace bucket
        run: |
          docker run -d --name openoctopus-rustfs \
            -p 9000:9000 -p 9001:9001 \
            -e RUSTFS_ACCESS_KEY=openoctopus \
            -e RUSTFS_SECRET_KEY=change-me-object-storage-secret \
            rustfs/rustfs@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21 \
            /data
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              docker logs openoctopus-rustfs
              exit 1
            fi
            sleep 1
          done
          python -c "from minio import Minio; Minio('localhost:9000', access_key='openoctopus', secret_key='change-me-object-storage-secret', secure=False).make_bucket('openoctopus')"

      - name: Lint with ruff
        run: ruff check .

      - name: Type-check with mypy
        run: mypy src

      - name: Run tests
        env:
          OO_RUN_CAPACITY_HARNESS: "1"
          OO_RUN_NETWORK_CAPACITY_HARNESS: "1"
          RUN_RUSTFS_INTEGRATION: "1"
          PY5_REAL_E2E: "1"
        run: pytest -v
