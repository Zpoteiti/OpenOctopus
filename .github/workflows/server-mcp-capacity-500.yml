name: Server MCP Capacity 500 Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [labeled, synchronize, reopened]

concurrency:
  group: server-mcp-capacity-500-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capacity-500:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'capacity-500')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run 500-user Server MCP gate
        run: |
          set -o pipefail
          python scripts/server_mcp_capacity_harness.py \
            --users 500 \
            --runtime-concurrency 8 \
            | tee server-mcp-capacity-500.json

      - name: Upload capacity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-mcp-capacity-500-${{ github.run_id }}
          path: server/server-mcp-capacity-500.json
          if-no-files-found: error
          retention-days: 30
