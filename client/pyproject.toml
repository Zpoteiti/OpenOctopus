[project]
name = "openoctopus-client"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "fastmcp-slim[client]==3.4.7",
    "markitdown[pdf,docx,xlsx,pptx]==0.1.7",
    "mcp==1.26.0",
    # Version 49 and later have no Intel macOS wheel; a source build can link an OpenSSL
    # ABI that conflicts with the library collected into the frozen bundle.
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "httpx>=0.27,<1",
    "jsonschema>=4.20,<5",
    "pathspec>=1.0,<2",
    "pydantic>=2.9,<3",
    "pypdf>=5.0",
    "regex>=2024.11,<2027",
    "uritemplate==4.2.0",
    "websockets>=15,<18",
    "pywinpty==3.0.5; sys_platform == 'win32'",
]

[project.optional-dependencies]
build = ["pyinstaller==6.21.0"]
dev = ["mypy>=1.13", "psutil>=6", "pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8", "types-jsonschema", "types-regex"]

[project.scripts]
openoctopus-client = "openoctopus_client.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
lint.select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
