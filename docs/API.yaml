      properties:
        name: { type: string, pattern: '^[a-z][a-z0-9_]{0,31}$' }
        transport: { type: string, enum: [sse] }
        url:
          type: string
          minLength: 1
          maxLength: 4096
          description: Exact legacy SSE endpoint; there is no Streamable HTTP fallback.
        headers:
          type: object
          maxProperties: 64
          additionalProperties: { type: string }
          description: Plaintext on write and redacted in REST; non-empty headers require HTTPS.
        enabled_capabilities: { $ref: '#/components/schemas/McpEnabledCapabilities' }
        max_concurrent_calls:
          type: integer
          minimum: 1
          maximum: 32
          default: 8

    ServerMcpServerConfigView:
      oneOf:
        - $ref: '#/components/schemas/ServerStdioMcpServerConfigView'
        - $ref: '#/components/schemas/ServerRemoteMcpServerConfigView'
      discriminator:
        propertyName: transport
        mapping:
          stdio: '#/components/schemas/ServerStdioMcpServerConfigView'
