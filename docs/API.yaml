        mcp_servers:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/ServerMcpServerConfig' }

    ServerMcpRuntimeError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message:
          type: string
          maxLength: 1024
          description: Sanitized OpenOctopus-authored diagnostic; never third-party text.

    ServerMcpRuntimeStatus:
      type: object
      additionalProperties: false
      required: [state, origin, config_revision, catalog_digest, runtime_generation, max_concurrent_calls, active_calls, waiting_calls, draining_calls, restart_attempt, last_error]
      properties:
        state:
          type: string
          enum: [starting, discovering, ready, unavailable, backoff, drifted, draining, cleanup_blocked]
        origin: { type: string, enum: [persisted, candidate] }
        config_revision: { type: [integer, "null"], format: int64, minimum: 1 }
        catalog_digest: { type: [string, "null"], pattern: '^[0-9a-f]{64}$' }
        runtime_generation: { type: [string, "null"], format: uuid }
        max_concurrent_calls: { type: integer, minimum: 1, maximum: 32 }
        active_calls: { type: integer, minimum: 0, maximum: 32 }
        waiting_calls: { type: integer, minimum: 0, maximum: 128 }
        draining_calls: { type: integer, minimum: 0, maximum: 32 }
        restart_attempt: { type: integer, minimum: 0 }
        last_error:
          oneOf:
            - $ref: '#/components/schemas/ServerMcpRuntimeError'
            - type: "null"

    ServerMcpRuntimeSlot:
      type: object
      additionalProperties: false
      required: [configured, active, draining]
      properties:
        configured: { type: boolean }
        active:
          oneOf:
            - $ref: '#/components/schemas/ServerMcpRuntimeStatus'
            - type: "null"
        draining:
          oneOf:
            - $ref: '#/components/schemas/ServerMcpRuntimeStatus'
            - type: "null"

