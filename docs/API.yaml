          sse: '#/components/schemas/ServerRemoteMcpServerConfigView'
      description: Canonical response-only redacted Server MCP config projection.

    ServerStdioMcpServerConfigView:
      type: object
      additionalProperties: false
      required: [name, transport, command, args, cwd, env, enabled_capabilities, max_concurrent_calls]
      properties:
        name: { type: string, pattern: '^[a-z][a-z0-9_]{0,31}$' }
