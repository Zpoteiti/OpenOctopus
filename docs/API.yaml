openapi: 3.1.0
info:
  title: OpenOctopus HTTP API
  version: 0.1.0
  description: |
    Python-main HTTP API contract for `openoctopus_server`. Pairs with
    [DECISIONS.md](DECISIONS.md) and [TOOLS.md](TOOLS.md).

    **Current implementation status:** `python-main` is the active server
    contract. Historical milestone labels remain only where a route description
    explicitly documents an earlier milestone.

    **Target design principle:** user-meaningful agent capabilities should have
    browser/programmatic REST entrances where the product needs them, and those
    entrances should share the same domain contract: authorization boundary,
    path semantics, validation rules, quota/accounting rules, and stable error
    codes. This does not require REST handlers and agent tools to share the same
    implementation function. REST, server-side tools, client-routed tools, and
    channel adapters may have different execution paths as long as they preserve
    the same externally visible contract. Some routes remain later-slice
    contracts until their implementation milestone is reached.

    **Parallel with tools (see TOOLS.md):**

    | Agent tool | REST equivalent | Notes |
    |---|---|---|
    | `read_file` | `GET /api/workspace/files/{path}` | Query: required `openoctopus_device` |
    | `write_file` | `PUT /api/workspace/files/{path}` | Query: required `openoctopus_device`; implicit mkdir -p |
    | `edit_file` | `PATCH /api/workspace/files/{path}` | Query: required `openoctopus_device`; body mirrors nanobot edit_file args |
    | `apply_patch` | `POST /api/workspace/patch` | Query: required `openoctopus_device`; body mirrors nanobot apply_patch args |
    | `delete_file` | `DELETE /api/workspace/files/{path}` | Query: required `openoctopus_device`; always allowed for quota release |
    | `delete_folder` | `DELETE /api/workspace/folders/{path}` | Query: required `openoctopus_device`; recursive, no flag |
    | `list_dir` | `GET /api/workspace/list/{path}` | Query: required `openoctopus_device`, recursive, limit, offset |
    | `find_files` | `GET /api/workspace/find-files` | Query: required `openoctopus_device`; query/glob/type/include_dirs/sort/limit/offset |
    | `grep` | `GET /api/workspace/grep` | Query: required `openoctopus_device`, pattern, path, mode, context_before/after, limit/offset |
    | `notebook_edit` | — | Agent-only in Py6; no REST equivalent |
    | `file_transfer` | `POST /api/workspace/transfer` | Body matches tool args; any two same-owner install sites; REST requires explicit `mode` |
    | `cron` | `POST /api/cron` + CRUD | REST uses verbs (POST/GET/DELETE); tool uses single action-enum (nanobot-aligned) |
    | `web_fetch` | — | No REST parallel (browser fetches directly). Tool is shared (server + client sites) per ADR-052. |
    | `message` | — | No REST parallel (browser composes via chat) |
    | `exec` | — | Client-only Py6 tool; routed over device WebSocket, no REST |
    | `write_stdin` | — | Client-only Py6 tool; routed over device WebSocket, no REST |
    | `list_exec_sessions` | — | Client-only Py6 tool; routed over device WebSocket, no REST |

    **Auth model:**

    - `OPENOCTOPUS_ADMIN_TOKEN` env var: required permanent secret. Anyone who presents it during
      registration becomes admin. Multiple admins are supported — share the
      token with teammates who should have admin rights.
    - All other endpoints use JWT, delivered either via `HttpOnly` cookie
      (browser) or `Authorization: Bearer <jwt>` (programmatic).
    - Admin-only endpoints require a valid JWT. The server reloads the current
      user row and requires `users.is_admin=true`; the database row is
      authoritative for admin authorization.

    **Wire conventions:**

    - JSON bodies everywhere except file reads, which return raw file bytes
      with an appropriate `Content-Type`, and streaming message POST responses,
      which return newline-delimited JSON events.
    - Py6 workspace collection routes return
      `{items, limit, offset, next_offset, truncated}`. `next_offset=null`
      means no ordinary next page; `truncated=true` means an internal safety
      ceiling stopped a complete scan. Other historical route families keep
      their documented response shapes until their owning milestone revisits
      them.
    - Errors always return a JSON body: `{code, message}`. `code` values come
      from the `ErrorCode` enum in `openoctopus_server/errors/`.
    - Timestamps are ISO 8601 with timezone offset.
    - UUIDs unless noted.

    **Python-main chat consumption pattern (ADR-121):**
    `POST /api/sessions/{session_id}/messages` durably accepts the user message, wakes
    the session runner, and may stream best-effort newline-delimited JSON events
    for that HTTP connection. `GET /api/sessions/{session_id}/messages` reads only
    PostgreSQL-backed canonical messages and run status. Reconnect falls back to
    polling `GET messages`; missed token deltas are not replayed.
    Each POST subscriber has bounded buffering. A client that cannot consume
    events before its buffer fills is disconnected without blocking the runner
    and recovers through `GET messages`.

    **Python-main deployment/concurrency boundary (ADR-122):**
    The Python server alpha runs one ASGI worker and uses asyncio tasks for
    I/O-bound concurrency. Redis and cross-worker command routing are not
    server-alpha dependencies. Process-local global and per-user admission
    bounds REST transfers, prompt construction, `web_fetch`, and isolated
    content conversion; these limits are not cross-worker rate limits. LLM
    provider concurrency remains independently controlled by the
    admin-configured `llm_max_concurrent_requests` semaphore. File IO, hashing,
    recursive grep/find_files, transfers, and document conversion must not
    block the event loop. No PostgreSQL connection is retained while waiting
    for admission, RustFS bytes, a conversion child, or the Provider.

    **Not in this spec:**

    - Discord and Telegram ingress. Those are internal adapter modules inside
      `openoctopus_server`, not public HTTP endpoints. The only public ingress for
      chat messages is `POST /api/sessions/{session_id}/messages` (browser) plus the
      `WS /ws/device` handshake for devices.

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://openoctopus.example.com
    description: Production (behind TLS reverse proxy)

tags:
  - name: Auth
    description: Registration, login, session management
  - name: Me
    description: The authenticated user's own account
  - name: Sessions
    description: Chat sessions, canonical messages, and best-effort POST streaming
  - name: Workspaces
    description: Personal and shared workspace management
  - name: Workspace Files
    description: Workspace file operations and device-routed file access
  - name: Devices
    description: Client device registration and configuration
  - name: Channels
    description: Discord and Telegram bot configurations per user
  - name: Cron
    description: Scheduled agent invocations
  - name: Admin
    description: Admin-only system config, shared-service Server MCP, and user management

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Check required server dependencies
      security: []
      description: |
        Checks PostgreSQL and RustFS concurrently. RustFS health is a
        non-mutating bucket-existence check; the stronger read/write/stat/delete
        capability probe runs only at startup. Runtime probes are single-flight
        on one dedicated RustFS connection, separate from the configured
        workspace object-operation pool.
        Shared Server MCP is optional: endpoint/process failure is reported only
        in the admin Server MCP projection and never changes this health result.
      responses:
        '200':
          description: Both dependencies are connected.
          content:
            application/json:
              example: {status: ok, db: connected, object_storage: connected}
        '503':
          description: One or both dependencies are disconnected.
          content:
            application/json:
              example: {status: error, db: connected, object_storage: disconnected}

  #
  # --- Auth ---
  #
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      description: |
        Creates a new user and their auto-created personal workspace.
        If `admin_token` in the body matches `OPENOCTOPUS_ADMIN_TOKEN`, the
        new user is created with `is_admin=true`. Otherwise a regular
        user. On success, returns the JWT and sets the auth cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
                admin_token:
                  type: string
                  description: Optional. Present it to claim `is_admin`.
      responses:
        '201':
          description: Created
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Sets the `openoctopus_session` HttpOnly cookie.
          content:
            application/json:
              schema:
                type: object
                required: [jwt, user]
                properties:
                  jwt: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email already in use.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: OK
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [jwt, user]
                properties:
                  jwt: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Log out (clear session cookie)
      security: []
      responses:
        '204':
          description: Cookie cleared.
          headers:
            Set-Cookie:
              schema: { type: string }

  #
  # --- Me ---
  #
  /api/me:
    get:
      tags: [Me]
      summary: Get the authenticated user's profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Me]
      summary: Update profile (name, email, password)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Email already belongs to another user.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    delete:
      tags: [Me]
      summary: Delete own account (cascades to all user data)
      description: |
        Commits the account deletion and a durable workspace-cleanup intent in
        PostgreSQL, then purges personal RustFS objects. A post-commit storage
        failure does not turn the logical deletion into an error: cleanup is
        retried by the running process and during startup (ADR-058, ADR-123).
        Database cascades remove devices, sessions, messages, cron_jobs,
        discord_configs, and telegram_configs.
        Shared workspace memberships are removed; shared workspaces the user
        was in persist for other members.
      responses:
        '204': { description: Account deleted. }

  #
  # --- Sessions ---
  #
  /api/sessions:
    description: Python-main browser chat session list route.
    get:
      tags: [Sessions]
      summary: List the user's chat sessions
      description: |
        Returns sessions owned by the authenticated user, including web,
        channel, cron, and heartbeat sessions. Sorts by `last_inbound_at DESC
        NULLS LAST`, then `created_at DESC`.

        Each returned `Session` includes a derived `unread` boolean for the
        browser inbox. `unread` is true when the session has user-visible
        messages newer than the session's `last_read_at` marker. The list does
        not include message previews or live run status.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/sessions/{session_id}:
    description: Python-main browser chat session route.
    parameters:
      - name: session_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Sessions]
      summary: Update session title or browser read marker
      description: |
        Updates user-owned session metadata. `title` renames the human-facing
        title for any owned session, including web, Discord, Telegram, cron, and
        heartbeat sessions. `read_through_message_id` marks canonical messages
        up to that message's `created_at` as read for the browser inbox.

        These metadata updates are allowed for web and non-web sessions because
        they do not write messages into the session, do not wake the runner, and
        do not affect `session_key` routing. `GET /api/sessions/{session_id}/messages`
        is a pure read and never updates `last_read_at`; frontends call this
        PATCH only after the relevant messages are actually visible to the user.

        `id`, `chat_id`, and `session_key` are server-owned and never change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              anyOf:
                - required: [title]
                - required: [read_through_message_id]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 120
                read_through_message_id:
                  type: string
                  format: uuid
                  description: |
                    User-visible canonical message id in this session. Server
                    sets `last_read_at` to the greater of the current
                    `last_read_at` and that message's `created_at`, so stale
                    tabs cannot move the marker backward. Pending messages do
                    not qualify until they drain into canonical `messages`. The
                    request fails if the message is not visible in this session.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Sessions]
      summary: Delete a session and its message history
      description: |
        Hard-deletes sessions owned by the authenticated user. Existing
        sessions owned by another user return `404` without revealing whether
        the id exists. Active cron sessions are rejected; delete the cron job
        through `/api/cron/{id}` so the job row and its history stay consistent.
        Completed one-shot cron sessions with no remaining `cron_jobs` row may
        be deleted here like other history.

        Deletion is a hard stop, not a safe-boundary cancel. The server first
        quiesces the in-memory runner, then deletes the `sessions` row.
        `session_deleted` is sent to live/queued POST streams only after that
        transaction commits. `ON DELETE CASCADE` removes canonical `messages`,
        durable `pending_messages`, and `turn_runs`. If the delete transaction
        rolls back, the session remains, the interrupted turn becomes
        `abandoned`, and no false deletion event is emitted. The server does
        not insert a stop marker or synthetic tool results because successful
        deletion removes the transcript.
      responses:
        '204': { description: Deleted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Active cron session; delete the cron job through `/api/cron/{id}` first.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/sessions/{session_id}/messages:
    description: Python-main browser chat message route.
    parameters:
      - name: session_id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: |
          Browser session UUID. The frontend generates this id before the
          first send. `POST` creates the web session if it is missing; `GET`
          only reads existing sessions.
    get:
      tags: [Sessions]
      summary: Canonical message history and run status
      description: |
        Returns only PostgreSQL-backed canonical state for this browser chat:
        persisted complete messages, durable pending user messages, and
        session/turn run status. It never returns in-flight token deltas from a
        running assistant response. Server-generated `<runtime>` metadata is
        retained in Postgres/provider replay but removed from the public
        `content` projection of human and pending messages.

        Frontend recovery uses this endpoint after a broken POST stream. If the
        response reports `status=running`, the frontend may poll with `after`
        or another cursor to observe message-level progress such as persisted
        assistant/tool-result rows and the eventual final assistant message.

        Cursor pagination applies only to canonical `messages`. If no cursor is
        supplied, the response returns the latest `limit` persisted messages in
        chronological order. `before` and `after` are mutually exclusive. The
        response always includes the session's full durable `pending_messages`
        queue, ordered by `(received_at, id)`, because those rows represent the
        user's immediate accepted-but-not-yet-provider-visible input.
      parameters:
        - name: after
          in: query
          schema: { type: string, format: uuid }
          description: |
            Return messages created strictly after this `message_id`.
            Used by reconnect/polling clients to fetch persisted progress.
            Cannot be combined with `before`.
        - name: before
          in: query
          schema: { type: string, format: uuid }
          description: |
            Return messages created strictly before this `message_id`.
            Used for scroll-back pagination. Cannot be combined with `after`.
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK — persisted messages plus run status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagesResponse' }
        '400':
          description: Invalid cursor, both cursors supplied, or invalid limit.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Sessions]
      summary: Send a user message, wake runner, stream best-effort preview
      description: |
        Durably accepts the user message and wakes or reserves the session
        runner. A `turn_id` identifies one normal agent-loop provider call plus
        the complete following tool batch returned by that call. A ReAct chain
        can therefore emit several `turn_started`/`turn_finished` pairs with
        different IDs on the same best-effort POST stream. Pending input does
        not invent an ID before its provider call begins. Disconnecting the
        response does not cancel the runner or roll back the message. Py2
        streams text/thinking token deltas from one provider call and has no
        tool progress; Py3 adds tool execution and `tool_progress` events
        without changing this detached-runner contract. Internal compaction
        call lifecycle is outside this public `turn_id` definition.

        If `{session_id}` does not exist, the server atomically creates a browser web
        session owned by the authenticated user: `id={session_id}`,
        `chat_id={session_id}`, `session_key=web:{session_id}`, and `title="New chat"`. If
        `{session_id}` already exists, the server verifies ownership before accepting
        the message. Existing sessions owned by another user return `404`
        without revealing whether the id exists.

        In Py2, if no runner is active and no durable pending rows remain, the
        message is written directly to provider-visible `messages`; active-run
        overlap is written to `pending_messages`. Beginning with Py3, every
        accepted user message is first durable in `pending_messages`. An idle
        runner promotes it immediately when Stage 1 compaction is unnecessary.
        When Stage 1 triggers, the incoming batch remains pending while active
        prior history is summarized; one commit marks the selected source rows
        compacted, inserts the active summary, then promotes the captured
        pending-human prefix. This preserves active order `S1, U11` without
        backdating. Messages accepted after preflight captures its ordered
        the preflight boundary remain pending for the next provider call. During
        an existing tool run, pending rows drain only after the current
        assistant tool batch is fully addressed.
        If pending rows survived a restart but no turn is running, the new
        input joins them and the entire ordered queue drains before the
        recovered turn starts.

        Pending browser messages use latest-wins streaming. The newest queued
        POST response may stay open as the live preview subscriber for the next
        pending batch. Older queued POST responses receive `stream_replaced`
        and close after their own message has been durably accepted. At the
        safe boundary, the runner captures the current pending rows in order;
        only that fixed prefix becomes the next provider-visible batch. Later
        arrivals remain pending for the following call. The latest
        still-connected queued stream for the captured batch receives its live
        preview. Reconnect/recovery uses
        `GET /api/sessions/{session_id}/messages`; missed token deltas are not replayed.

        Py2 retries a transient provider failure only before the first
        text/thinking delta is emitted. A later failure persists a
        `synthetic_assistant_error`, marks the turn failed, and discards the
        incomplete assistant preview from durable state.

        **Browser write allow-list (ADR-098).** `{session_id}` is `sessions.id`, not
        `session_key`. The server accepts writes only when `channel == "web"`
        and `session_key` starts with `web:`. Discord/Telegram/cron/heartbeat
        sessions are read-only through browser REST and receive messages
        exclusively from their own pipelines.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                effort:
                  allOf:
                    - $ref: '#/components/schemas/Effort'
                  nullable: true
                  description: |
                    Optional per-turn thinking effort. If omitted, `null`, or
                    `off`, OpenOctopus sends `thinking.type=disabled` and omits
                    `output_config`. Non-off values send
                    `thinking.type=adaptive` plus `output_config.effort` set to
                    the same enum value. Gateways for non-Anthropic runtimes
                    must translate these values if their backend uses a
                    different thinking control shape.
                content:
                  type: array
                  description: |
                    Required Anthropic user content blocks. Browser callers may
                    send `text` and inline base64 `image` blocks.
                    `tool_use`, `tool_result`, `thinking`,
                    `redacted_thinking`, `document`, and OpenAI `image_url`
                    blocks are rejected.
                  items: { $ref: '#/components/schemas/UserContentBlock' }
                attachments:
                  type: array
                  maxItems: 10
                  description: |
                    References to existing files in the authenticated user's
                    Server workspace. Upload bytes first through the workspace
                    file API, then send the original virtual path here. The
                    message API never moves, copies, or deletes the file.

                    Non-image files add a path marker so the agent can inspect
                    them with workspace tools. JPEG, PNG, GIF, and WebP files
                    also add a base64 image snapshot. At most 8 MiB of image
                    bytes may be expanded across one request.
                  items: { $ref: '#/components/schemas/MessageAttachmentRef' }
              required: [content, attachments]
              anyOf:
                - properties: { content: { minItems: 1 } }
                - properties: { attachments: { minItems: 1 } }
              additionalProperties: false
      responses:
        '200':
          description: |
            Streaming response opened. The body is newline-delimited JSON. Each
            line is a `PostMessageStreamEvent`. The first event is always
            `message_accepted`. Events are best-effort preview data except
            accepted/persisted-message notifications, which reference rows that
            are already committed to Postgres. A queued response may close with
            `stream_replaced` if a newer queued POST becomes the live subscriber
            for the next pending batch.
          content:
            application/x-ndjson:
              schema:
                type: string
                description: Newline-delimited `PostMessageStreamEvent` objects.
        '400':
          description: |
            Session id is not a valid UUID, session is not browser-writable,
            JSON/content shape is invalid, or an image block is malformed.
            Attachment paths must resolve inside the authenticated user's
            Server workspace and supported attachment images must fit the
            aggregate 8 MiB expansion limit. If present, `effort` must be
            `null` or one of `off`, `low`, `medium`, `high`, `xhigh`, or `max`.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: Session id exists for another user, or an attachment workspace/file does not exist.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: The user cannot read a referenced shared-workspace attachment.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503':
          description: The Provider is not configured, or attachment storage is unavailable.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/sessions/{session_id}/cancel:
    description: Session runner cancellation route.
    parameters:
      - name: session_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Sessions]
      summary: Request cancellation at next safe boundary (ADR-035)
      description: |
        Requests safe-boundary cancellation for any session owned by the
        authenticated user. This is a session-control operation, not a browser
        message write, so it is allowed for web and non-web sessions. Existing
        sessions owned by another user return `404` without revealing whether
        the id exists.

        If no runner is active, this is a no-op and returns
        `cancel_requested=false`; the server must not leave an idle session with
        a stale cancel flag. If a runner is active, the server sets
        `cancel_requested=true`. The agent loop lets the current LLM request or
        tool call finish. If the current external action is an LLM request, the
        assistant response is persisted first. A response with no `tool_use`
        completes normally, clears the flag, and does not add a stop marker. A
        response containing tools is checked before dispatch; the loop inserts
        synthetic `tool_result` blocks with `code="user_cancelled"` for every
        unstarted tool in that assistant batch, inserts `"[User pressed stop]"`
        as a `message_kind="human"` message, clears the flag, emits
        `turn_finished` with `status="cancelled"` on any active POST preview
        stream, and exits without another LLM call. If a tool is already in
        flight, it finishes normally and only the remaining tools are skipped.
      responses:
        '202':
          description: Cancellation requested.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancel_requested: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  #
  # --- Workspaces ---
  #
  /api/workspaces:
    description: Workspace management route.
    get:
      tags: [Workspaces]
      summary: List workspaces the user has access to (personal + shared)
      description: |
        Returns the authenticated user's personal workspace plus all shared
        workspaces they can access. Each `Workspace` includes quota state
        (`quota_bytes`, `bytes_used`, `locked`), so there is no separate
        personal quota endpoint.
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspacePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Workspaces]
      summary: Create a shared workspace (caller auto-added to allow-list)
      description: |
        Creates a shared workspace with a fresh UUID and the supplied display
        name. Names are NOT globally unique — two unrelated teams may use the
        same name. The server returns the workspace's id and computed
        addressing form (`name@suffix`, see ADR-108) which is used in
        subsequent URLs and in the agent's tool paths.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, quota_bytes]
              additionalProperties: false
              properties:
                name:
                  type: string
                  description: |
                    Display name. Validated per ADR-109 — denylist of `/`, `\`, `\0`,
                    `@`, `:`, `<>"|?*`, control chars; NFC-normalized; trim + collapse
                    internal whitespace; max 64 chars after normalization.
                quota_bytes:
                  type: integer
                  format: int64
                  description: Requested quota. Python-main caps this at configured `system_config.shared_workspace_quota_bytes`; if that key is missing, setup must handle it explicitly.
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400':
          description: Name failed validation (per ADR-109).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: |
            Caller is already a member of a workspace whose `name@suffix` form
            collides with the new one (suffix auto-extension exhausted, or the
            caller already has a same-named workspace and would not be able to
            disambiguate). Caller picks a different name.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/workspaces/{workspace_ref}:
    description: Workspace management route.
    parameters:
      - name: workspace_ref
        in: path
        required: true
        description: |
          The `name@suffix` addressing form (ADR-108). `suffix` is the first 8
          hex chars of the workspace's UUID id (auto-extended on collision).
          Example: `Xmas%20gift@a4f7e2d1`. Spaces in the name URL-encode normally;
          `@` itself does not require encoding (RFC 3986 `pchar`).
        schema: { type: string }
    get:
      tags: [Workspaces]
      summary: Get a workspace's details
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Workspaces]
      summary: Update a shared workspace (rename, change quota)
      description: |
        Any member of the allow-list can rename or change the quota cap
        (ADR-flat-permissions). Rename only mutates `workspaces.name` —
        the RustFS object prefix and `workspaces.id` are unchanged, so no
        object moves happen. The `suffix` portion of the addressing form is
        also unchanged (it is derived from `id`). However, since strict
        mode (ADR-108) requires both `name` and `suffix` to match in
        tool paths, any stored references using the old name return
        404 until the agent re-reads the system prompt.

        Name validation per ADR-109 applies on rename.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                name: { type: string }
                quota_bytes: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } }
        '400':
          description: Name failed validation (per ADR-109) or quota exceeds the admin ceiling.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/workspaces/{workspace_ref}/members:
    description: Workspace membership route.
    parameters:
      - name: workspace_ref
        in: path
        required: true
        description: The `name@suffix` form (ADR-108).
        schema: { type: string }
    get:
      tags: [Workspaces]
      summary: List allow-list for a shared workspace
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceMemberPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Workspaces]
      summary: Add a user to the allow-list
      description: |
        Any existing member can add new members. Caller looks up by email or
        user_id. If adding the prospective user would put them into two
        workspaces whose computed `name@suffix` form would collide (rare —
        defended by suffix auto-extension at workspace-create time per
        ADR-108, but still possible on edge cases), the server returns 409
        and the workspace's owner can rename to disambiguate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              oneOf:
                - { required: [user_id] }
                - { required: [email] }
              properties:
                user_id: { type: string, format: uuid }
                email: { type: string, format: email }
      responses:
        '201':
          description: Member added.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceMember' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Adding this user would create an unresolvable `name@suffix` collision in their accessible set.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/workspaces/{workspace_ref}/members/{member_user_id}:
    description: Workspace membership route.
    parameters:
      - name: workspace_ref
        in: path
        required: true
        description: The `name@suffix` form (ADR-108).
        schema: { type: string }
      - name: member_user_id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Workspaces]
      summary: Remove a user from the allow-list
      description: |
        Any member can remove anyone (including themselves). Removing
        the last member commits workspace deletion plus a durable cleanup
        intent. RustFS purge is idempotent and retried after transient failure.
      responses:
        '204': { description: Removed. }
        '400': { $ref: '#/components/responses/BadRequest' }

  #
  # --- Workspace Files ---
  #
  # NOTE on path params: the server accepts a URL-encoded absolute path as a
  # single `{path}` path-param. Clients should encode `/` as `%2F` inside the
  # param value, OR the server can route via a wildcard and keep slashes raw.
  # Implementation choice — the OpenAPI shape is the same either way.
  #
  /api/workspace/files/{path}:
    description: |
      Py6 Workspace Files route. `openoctopus_device` is explicit: `server`
      selects the server workspace, while a paired device name routes to the
      live device WebSocket. All server and device paths use the same public
      response shapes; device paths are checked again by the client.
    parameters:
      - name: path
        in: path
        required: true
        description: |
          Path on the selected install site. For `server`, relative paths
          resolve to the authenticated user's personal workspace and absolute
          `/name@suffix/...` paths address shared workspaces. For a paired
          device, the client applies its own workspace/path policy.
        schema: { type: string }
      - $ref: '#/components/parameters/OpenOctopusDevice'
    get:
      tags: [Workspace Files]
      summary: Read workspace file contents
      parameters:
        - name: openoctopus_device_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: |
            Optional immutable device identity from a `device_file` delivery
            reference. When supplied, both this id and `openoctopus_device`
            must still identify the same owned device; rename, deletion, or
            name reuse returns `tool_device_unreachable`.
      description: |
        For `openoctopus_device=server`, authorizes through `WorkspaceService`
        and streams RustFS object bytes. For a paired device, opens an
        `http_relay` transfer only after the client sends `transfer_begin`
        metadata; required `total_bytes` becomes `Content-Length`, `etag`
        becomes the quoted `ETag`, and a safe `mime` hint selects the response
        media type. Device bytes are relayed directly to the browser and are
        never written to RustFS. Downloads use process-local fair admission
        shared per user with uploads, plus an independent global download
        limit. Admission is held until the response closes. There is no Range
        support. A queue timeout returns `workspace_transfer_busy`; if a body
        send stalls after 200 headers, the stream closes because its status can
        no longer change.
      responses:
        '200':
          description: OK — returns a backpressured raw file stream.
          headers:
            ETag:
              description: Quoted opaque file revision for a later `If-Match`.
              schema: { type: string }
            Content-Length:
              description: File size in bytes.
              schema: { type: integer, format: int64 }
            Content-Disposition:
              description: Safe attachment filename.
              schema: { type: string }
            X-Content-Type-Options:
              description: Always `nosniff` for user-controlled files.
              schema: { type: string, enum: [nosniff] }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Paired device is offline or cannot accept the relay (`tool_device_unreachable`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: Transfer admission timed out (`workspace_transfer_busy`).
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema: { type: integer, minimum: 1 }
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    put:
      tags: [Workspace Files]
      summary: Write workspace file contents
      description: |
        Full-content replace. Accepts raw `application/octet-stream` bytes.
        For a paired device, the server sends a `workspace_upload` transfer;
        the client returns committed `size`, opaque `etag`, and `created`
        metadata in the same `FileMutation` response shape as the server.
        Implicit `mkdir -p` on the parent path (ADR-088) and
        `WorkspaceService` quota checks apply.
        Server-side writes, hashes, and recursive operations must use the
        workspace service's background/thread boundary rather than blocking the
        FastAPI or agent event loop.
        Missing precondition headers mean an intentional unconditional full
        replacement. `If-None-Match: *` provides race-safe creation.
        Server uploads use the same per-user transfer limit as downloads and a
        separate global upload limit. The permit covers request-body collection
        through the RustFS write. Queue timeout returns
        `workspace_transfer_busy`; lack of progress while receiving the next
        body chunk returns `workspace_transfer_timeout` and does not commit a
        file.
      parameters:
        - name: If-Match
          in: header
          required: false
          schema: { type: string }
          description: Optional single strong ETag. Stale revisions return `workspace_file_changed`.
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string, enum: ['*'] }
          description: Optional `*` for create-only semantics. Cannot be combined with `If-Match`.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Written. Returns the new metadata and ETag.
          headers:
            ETag:
              description: Quoted opaque revision after the write.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileMutation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Invalid SKILL.md after upload, if skill validation is active for the target path.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: Quota/precondition conflict, paired device offline (`tool_device_unreachable`), or operation exceeds the 64 MiB device upload cap (`workspace_upload_too_large`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '408':
          description: Upload body made no progress before the idle timeout (`workspace_transfer_timeout`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: Transfer admission timed out (`workspace_transfer_busy`).
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema: { type: integer, minimum: 1 }
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '502':
          description: Device or server transfer failed integrity verification.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    patch:
      tags: [Workspace Files]
      summary: Edit a workspace file by text replacement
      description: |
        Text edit. Request body mirrors nanobot's `edit_file` schema:
        `old_text`/`new_text` plus optional `replace_all`, `occurrence`,
        `line_hint`, and `expected_replacements`. `old_text=""` keeps
        nanobot's create-file shortcut when the target does not exist; ordinary
        create/replace remains available through `PUT`.
      parameters:
        - name: If-Match
          in: header
          required: false
          schema: { type: string }
          description: Optional single strong ETag. Missing means edit the latest locked content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_text, new_text]
              additionalProperties: false
              properties:
                old_text: { type: string }
                new_text: { type: string }
                replace_all: { type: boolean, default: false }
                occurrence:
                  type: [integer, "null"]
                  minimum: 1
                  description: Optional 1-based occurrence to replace when old_text appears multiple times.
                line_hint:
                  type: [integer, "null"]
                  minimum: 1
                  description: Optional 1-based line hint used to choose the nearest match.
                expected_replacements:
                  type: [integer, "null"]
                  minimum: 1
                  description: Optional guard for the number of replacements that must be made.
      responses:
        '200':
          description: Edit applied.
          headers:
            ETag:
              description: Quoted opaque revision after the edit.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileMutation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Invalid SKILL.md produced by an edit, if skill validation is active for a target path.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: Quota lock, operation exceeds quota, or paired device is offline (`tool_device_unreachable`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    delete:
      tags: [Workspace Files]
      summary: Delete a single workspace file
      description: |
        Deletes a file from the selected install site. Server deletes are
        always allowed regardless of quota lock state.
      parameters:
        - name: If-Match
          in: header
          required: false
          schema: { type: string }
          description: Optional single strong ETag. Missing means unconditional delete.
      responses:
        '204': { description: Deleted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Paired device is offline (`tool_device_unreachable`) or the target is not a regular file.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/workspace/folders/{path}:
    description: Workspace folder route for explicit `openoctopus_device`.
    parameters:
      - name: path
        in: path
        required: true
        description: Path on the target `openoctopus_device`, with the same resolution rules as `/api/workspace/files/{path}`.
        schema: { type: string }
      - $ref: '#/components/parameters/OpenOctopusDevice'
    delete:
      tags: [Workspace Files]
      summary: Recursively delete a workspace folder
      responses:
        '204': { description: Deleted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Path is a file — use `DELETE /api/workspace/files/{path}` — or the paired device is offline (`tool_device_unreachable`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/workspace/patch:
    description: |
      Workspace apply_patch route for explicit `openoctopus_device`. Request body
      mirrors nanobot's `apply_patch` schema. Applies structured multi-file
      edits in the selected install site.
    parameters:
      - $ref: '#/components/parameters/OpenOctopusDevice'
    post:
      tags: [Workspace Files]
      summary: Apply structured workspace edits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [edits]
              additionalProperties: false
              properties:
                edits:
                  type: array
                  minItems: 1
                  maxItems: 20
                  description: List of edits to apply. Each edit specifies a file and the change to make.
                  items:
                    type: object
                    required: [path, action]
                    additionalProperties: false
                    properties:
                      path:
                        type: string
                        description: Relative path to the file to edit. OpenOctopus shared workspace absolute paths still follow ADR-108.
                      action:
                        type: string
                        enum: [replace, add]
                        description: Operation type.
                      old_text:
                        type: [string, "null"]
                        description: Exact text to search for in the file. Required for replace.
                      new_text:
                        type: [string, "null"]
                        description: Text to replace with or append. Required for replace and add.
                dry_run:
                  type: boolean
                  default: false
                  description: Validate and summarize the patch without writing files.
      responses:
        '200':
          description: Patch applied or dry-run summary generated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StructuredPatchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Invalid SKILL.md produced by an edit, if skill validation is active for a target path.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: No match, quota lock, invalid patch, operation exceeds quota, or paired device is offline (`tool_device_unreachable`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/workspace/list/{path}:
    description: Workspace directory listing route for explicit `openoctopus_device`.
    parameters:
      - name: path
        in: path
        required: true
        description: Directory path on the target `openoctopus_device`, with the same resolution rules as `/api/workspace/files/{path}`.
        schema: { type: string }
      - $ref: '#/components/parameters/OpenOctopusDevice'
      - { name: recursive, in: query, required: false, schema: { type: boolean, default: false }, description: 'Recursively list all files (default false).' }
      - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }, description: 'Maximum entries to return.' }
      - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }, description: 'Skip the first N matching entries.' }
    get:
      tags: [Workspace Files]
      summary: List workspace directory contents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListDirEntryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Paired device is offline (`tool_device_unreachable`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/workspace/find-files:
    description: Workspace find_files route for explicit `openoctopus_device`.
    get:
      tags: [Workspace Files]
      summary: Find workspace files by path fragment, glob, or type
      parameters:
        - $ref: '#/components/parameters/OpenOctopusDevice'
        - { name: path, in: query, required: false, schema: { type: string }, description: "Directory or file to search in. Defaults to `.` inside the selected device/workspace." }
        - { name: query, in: query, required: false, schema: { type: string }, description: 'Optional case-insensitive path fragment search. Whitespace-separated terms must all be present.' }
        - { name: glob, in: query, required: false, schema: { type: string }, description: 'Optional file filter, e.g. `*.py` or `tests/**/test_*.py`.' }
        - { name: type, in: query, required: false, schema: { type: string }, description: 'Optional file type shorthand, e.g. `py`, `ts`, `md`, or `json`.' }
        - { name: include_dirs, in: query, required: false, schema: { type: boolean, default: false }, description: 'Include matching directories as well as files.' }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [path, modified], default: path }, description: 'Sort by path or most recently modified first.' }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }, description: 'Maximum number of paths to return.' }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }, description: 'Skip the first N matching entries.' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListDirEntryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Paired device is offline (`tool_device_unreachable`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/workspace/grep:
    description: Workspace grep route for explicit `openoctopus_device`.
    get:
      tags: [Workspace Files]
      summary: Search workspace file contents
      parameters:
        - $ref: '#/components/parameters/OpenOctopusDevice'
        - { name: pattern, in: query, required: true, schema: { type: string }, description: 'Regex pattern.' }
        - { name: path, in: query, required: false, schema: { type: string }, description: 'Optional file or directory path inside the selected install site. Omit to search its workspace root.' }
        - { name: glob, in: query, required: false, schema: { type: string }, description: 'Optional file filter, e.g. `*.py` or `tests/**/test_*.py`.' }
        - { name: type, in: query, required: false, schema: { type: string }, description: 'Optional ripgrep-style file type shorthand, e.g. `py`, `ts`, `md`, or `json`.' }
        - { name: fixed_strings, in: query, required: false, schema: { type: boolean, default: false }, description: 'Treat pattern as plain text instead of regex.' }
        - { name: case_insensitive, in: query, required: false, schema: { type: boolean, default: false }, description: 'Case-insensitive search.' }
        - { name: output_mode, in: query, required: false, schema: { type: string, enum: [content, files_with_matches, count], default: files_with_matches }, description: 'Shape of grep results.' }
        - { name: context_before, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 20, default: 0 }, description: 'Lines of context before a match in content mode.' }
        - { name: context_after, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 20, default: 0 }, description: 'Lines of context after a match in content mode.' }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }, description: 'Maximum number of file entries or content match blocks.' }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }, description: 'Skip the first N results before applying `limit`.' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrepResultPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Paired device is offline (`tool_device_unreachable`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/workspace/transfer:
    description: |
      Workspace transfer route. Mirrors the `file_transfer` tool args and
      automatically accepts one regular file or one recursive directory
      across Server→Server, Server→Client, Client→Server, same-Client, and
      distinct same-owner Client topologies. A same-Client directory move
      uses an exclusive no-replace native rename when the platform can provide
      it; other directory paths copy one manifest file at a time. A
      distinct-Client transfer is a bounded pure relay between two captured
      online Device routes: the Server verifies and forwards bytes without a
      durable byte cache or RustFS staging object. Destination overwrite and
      merge are always rejected. Streamed moves delete the source
      conditionally only after the complete destination is finalized.
    post:
      tags: [Workspace Files]
      summary: Copy or move one file or recursive directory between same-owner install sites
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferRequest' }
      responses:
        '200':
          description: Transfer completed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '408':
          description: Transfer made no progress before the idle timeout.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '413':
          description: Directory manifest exceeds 10,000 entries or 5 MiB.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: A personal destination SKILL.md is invalid.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: Destination exists, a path/precondition conflicts, a target Device is unreachable, or an issued outcome is unknown.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: Transfer capacity is busy; retry after the indicated delay.
          headers:
            Retry-After: { schema: { type: integer } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '502':
          description: Streamed transfer failed integrity verification.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503':
          description: Server workspace storage, Client destination storage, or the transfer service is unavailable.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  #
  # --- Devices ---
  #
  /api/devices:
    description: Python-main device management route.
    get:
      tags: [Devices]
      summary: List user's devices
      description: |
        Returns all device details for the authenticated user in one array.
        Python-main does not paginate this route and does not implement
        `GET /api/devices/{name}`. Responses include `token_hint` for user
        confirmation and never include the plaintext token. `token_hint` is
        stored as a non-secret issuance hint.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Device' }
    post:
      tags: [Devices]
      summary: Register a new device (returns the token once)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  description: |
                    Raw device name. The server canonicalizes it into the
                    stored routing slug: NFC normalize, trim, ASCII-lowercase,
                    convert whitespace runs to a single hyphen, then require
                    `^[a-z0-9]+(-[a-z0-9]+)*$`. Example: `"Alice Laptop"` is
                    stored as `alice-laptop`. The stored value is unique
                    within the user's devices, at most 64 characters, and must
                    not be `server`.
                workspace_path:
                  type: string
                  description: |
                    Optional. Defaults to the literal string `~/openoctopus/workspace`
                    for every OS (Linux/macOS/Windows) per ADR-111 if omitted.
                    The client expands `~` against its own home directory at
                    startup; the server stores and returns the unexpanded form.
                restrict_to_workspace:
                  type: boolean
                  default: true
                  description: |
                    Optional. Defaults to `true`. Limits OpenOctopus-resolved
                    Client file paths and exec/PTY initial working directories
                    to `workspace_path`. It is not an OS sandbox and does not
                    restrict shell commands, MCP, or networking.
                ssrf_denylist:
                  type: array
                  maxItems: 256
                  items: { type: string, minLength: 1, maxLength: 512 }
                  description: |
                    Optional. CIDR, host, or `host:port` entries blocked by
                    client-site `web_fetch`, independently of
                    `restrict_to_workspace`. Omission uses the default
                    private/reserved/metadata list; explicit `[]` permits
                    internal targets.
                shell_timeout_max:
                  type: integer
                  minimum: 0
                  maximum: 86400
                  default: 600
                  description: Maximum hard lifetime in seconds for client `exec`.
                env_allowlist:
                  type: array
                  maxItems: 64
                  uniqueItems: true
                  items: { type: string, minLength: 1, maxLength: 128 }
                  description: Exact parent environment names inherited by exec children; `OPENOCTOPUS_*` is always rejected.
      responses:
        '201':
          description: |
            Device created. The response includes the token ONCE — it is
            never returned again. Tokens are random bearer credentials with the
            `openoctopus_dev_` prefix. Lost tokens require
            `POST /api/devices/{name}/regenerate-token`.
            Client startup uses the token via the `OPENOCTOPUS_DEVICE_TOKEN` env
            var; the active device config (`workspace_path`,
            `restrict_to_workspace`, `ssrf_denylist`, `shell_timeout_max`,
            `env_allowlist`) is fetched
            from the server's `hello_ack` frame at the WebSocket handshake.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [token, device]
                properties:
                  token:
                    type: string
                    description: Bearer token with `openoctopus_dev_` prefix. The device sends it at WebSocket handshake. Shown once.
                  device: { $ref: '#/components/schemas/Device' }
        '400':
          description: Invalid name after canonicalization or invalid Device config.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: |
            A device with the same canonicalized name already exists for this
            user. Different users may reuse the same device name.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/devices/{name}/config:
    description: Py7 Device configuration and last-good MCP discovery route.
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Devices]
      summary: Read Device MCP config and last-good discovery
      description: |
        Returns the current `config_revision`, redacted MCP configuration, and
        the persisted last-good catalog projection. Stdio env and remote header
        keys remain visible, but every value is `"<redacted>"`. The catalog is
        available while the Device is offline and includes disabled entries so
        callers can construct an exact `enabled_capabilities` allowlist.
        Response-only fields show whether a Server MCP name shadows a complete
        Device config and whether each enabled capability remains Provider
        visible after Server namespace, exact-name, and Server-first capacity
        selection. These fields are derived and are never PATCH input.
      responses:
        '200':
          description: Current Device MCP configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Devices]
      summary: Validate and update Device config
      description: |
        Every request supplies the `base_config_revision` returned by GET;
        stale revisions fail with 409 before validation or persistence. Other
        top-level fields are partial updates. `ssrf_denylist`, `env_allowlist`,
        and `mcp_servers` are whole-field replacements.

        Every new or modified MCP server, including filter-only changes,
        requires the current Client to be online and to complete real MCP
        initialize plus bounded discovery of tools, static resources, resource
        templates, and prompts. Failure saves nothing. Pure MCP deletion may
        commit offline; a request mixing deletion with any add/modify still
        requires online validation. `POST /api/devices` never accepts MCP.

        Config secrets are stored as plaintext in PostgreSQL but redacted in
        REST responses. A `"<redacted>"` marker retains an existing value only
        for the identical server/sink/key; changing a sink requires resending
        all its secrets. Non-empty MCP env/headers require a secure WSS Device
        connection. A successful commit atomically updates config, last-good
        catalog, and revision before pushing the authoritative Protocol v3
        config to the Client.

        A Device candidate may preserve or delete an existing MCP whose name is
        now reserved by Server MCP, but it may not add or effectively modify
        that reserved name. The final commit fence rechecks reservations and
        exact enabled Server-name collisions; failures save nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceConfigPatch' }
      responses:
        '200':
          description: Updated config and last-good discovery projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceConfig' }
        '400':
          description: |
            Invalid non-MCP config shape. Unknown fields are rejected.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: MCP syntax, spawn, initialize, discovery, or capability-limit validation failed; nothing was saved.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Stale revision, Server-reserved MCP name, rename/schema collision,
            owner aggregate limit, Device offline/replaced/busy, or insecure
            secret transport.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/devices/{name}:
    description: Python-main device management route.
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Devices]
      summary: Remove a device (revokes its token)
      description: |
        Deletes the device row. This is the state-3 complete wipe from ADR-110:
        the token immediately stops authenticating, any active WebSocket
        connection is closed with 4401. Calls not yet issued fail as
        `tool_device_unreachable`; issued or ambiguous calls fail as
        `tool_execution_outcome_unknown`. The device disappears from future
        `openoctopus_device` enums.
      responses:
        '204': { description: Removed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/devices/{name}/regenerate-token:
    description: Python-main device token route.
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Devices]
      summary: Regenerate the device's auth token
      description: |
        Invalidates the old token, returns a new one exactly once, and
        preserves the existing Device identity, workspace policy, MCP config,
        and last-good catalog. Any active
        connection for the old token is closed with 4401. Calls not yet issued
        fail as `tool_device_unreachable`; issued or ambiguous calls fail as
        `tool_execution_outcome_unknown`. The device remains paired but appears
        offline until the user restarts/reconfigures the client with the new token.
      responses:
        '200':
          description: New token.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [token, device]
                properties:
                  token: { type: string }
                  device: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  #
  # --- Channels ---
  #
  /api/channels:
    description: User channel configuration list route.
    get:
      tags: [Channels]
      summary: List all supported channel configs
      description: |
        Returns every channel type supported by this server, including
        unconfigured entries. There is no separate
        `GET /api/channels/{channel}` route; frontends can filter this list.
        Secret fields are never returned. Configured bot channels return
        platform-specific config field names such as `bot_token_hint`,
        `partner_chat_id`, and `allow_list`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChannelConfigView' }

  /api/channels/{channel}:
    description: Generic per-channel configuration mutation route.
    parameters:
      - name: channel
        in: path
        required: true
        schema: { type: string, enum: [discord, telegram] }
        description: Supported channel type. Unknown values fail with `unknown_channel`.
    patch:
      tags: [Channels]
      summary: Create or partially update a channel config
      description: |
        Partial top-level update. Omitted fields remain unchanged. Platform
        payloads keep platform-specific field names instead of abstracting
        everything into a generic config map.

        Config existence means enabled; there is no `enabled` flag. `DELETE`
        disables a channel by deleting its config row. `allow_list`, when
        present, replaces the whole list. Sending `bot_token: "<redacted>"` is
        rejected; omit `bot_token` to keep the existing secret. A `bot_token`
        change is validated against the platform before persistence. A
        `partner_chat_id` change is validated by sending a pairing/success
        message to that target before persistence. `allow_list` gets schema
        validation only; adapters resolve and classify entries at receive time.

        Runtime hot reload is a Py10 contract: after a successful DB write, the
        ChannelManager reloads or starts the affected user's adapter. Py-Prep
        only fixes the API/storage contract.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelConfigPatch' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelConfigView' }
        '400':
          description: Malformed payload, unknown channel, or `"<redacted>"` sent as a secret value.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: Platform validation failed, pairing message failed, or runtime config could not be applied.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    delete:
      tags: [Channels]
      summary: Delete a channel config
      description: |
        Deletes the user's config row for this channel. The channel is disabled
        because config existence is the enablement state. Py10 hot reload stops
        the affected adapter after successful deletion.
      responses:
        '204': { description: Removed. }
        '400':
          description: Unknown channel.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  #
  # --- Cron ---
  #
  /api/cron:
    description: Py9 cron management route.
    get:
      tags: [Cron]
      summary: List the user's cron jobs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CronJob' }
    post:
      tags: [Cron]
      summary: Create a cron job (mirrors `cron` tool, ADR-053)
      description: |
        Py9 cron route.

        REST-created and agent-created jobs use the same shared write helper.
        The helper creates a dedicated cron session with
        `session_key="cron:{job_id}"`; the job's `message` is injected into
        that session as a synthesized user message when the schedule fires.
        Cron sessions do not inherit the creator session's chat history and
        are not writable through `POST /api/sessions/{session_id}/messages`.

        The shared helper validates the schedule before storing it:
        exactly one of `every_seconds`, `cron_expr`, or `at`; positive
        intervals; valid cron expressions; known IANA timezone when `tz`
        is present; and a future `next_fire_at`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                name:
                  type: string
                  description: Optional short human-readable label. Defaults to the first 30 characters of message.
                message:
                  type: string
                  description: Becomes the synthesized user message at firing time.
                every_seconds:
                  type: integer
                  minimum: 1
                  description: Interval in seconds for recurring jobs. Mutually exclusive with cron_expr and at.
                cron_expr:
                  type: string
                  description: Cron expression like "0 9 * * *". Mutually exclusive with every_seconds and at.
                tz:
                  type: string
                  description: Optional IANA timezone for cron_expr and naive at timestamps.
                at:
                  type: string
                  format: date-time
                  description: One-shot future execution time. Mutually exclusive with every_seconds and cron_expr.
      responses:
        '201':
          description: Created.
          content: { application/json: { schema: { $ref: '#/components/schemas/CronJob' } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/cron/{id}:
    description: Py9 cron management route.
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Cron]
      summary: Get a cron job
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/CronJob' } } }
    patch:
      tags: [Cron]
      summary: Update a cron job's schedule, label, or message
      description: |
        Py9 cron route.

        Uses the same shared cron write helper as create/delete, so schedule
        updates are validated and the cron ticker is notified after the row
        changes. There is no `enabled` flag and no pause/resume endpoint;
        delete jobs that should stop firing.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                message: { type: string }
                every_seconds:
                  type: integer
                  minimum: 1
                  description: Replaces the schedule with an interval schedule. Mutually exclusive with cron_expr and at.
                cron_expr:
                  type: string
                  description: Replaces the schedule with a cron expression. Mutually exclusive with every_seconds and at.
                tz:
                  type: string
                  description: Optional IANA timezone for cron_expr and naive at timestamps.
                at:
                  type: string
                  format: date-time
                  description: Replaces the schedule with a one-shot future execution time. Mutually exclusive with every_seconds and cron_expr.
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/CronJob' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [Cron]
      summary: Delete a cron job
      description: Deletes the cron job and its dedicated cron session/history through the shared cron write helper.
      responses:
        '204': { description: Deleted. }

  #
  # --- Admin ---
  #
  /api/admin/config:
    get:
      tags: [Admin]
      summary: Get system-wide config (admin only)
      description: |
        Returns OpenOctopus-recognized admin config keys only. Deployment-local
        or unknown `system_config` keys are ignored by this API.
        Secret-bearing values such as a configured `llm_api_key` are redacted.
        Known keys:

          - `quota_bytes` (int) — per-user workspace quota (ADR-046).
            If no row is configured, the effective default is 500 MiB
            (`524288000`).
          - `shared_workspace_quota_bytes` (int) — quota ceiling that any
            single shared workspace may request. If no row is configured, the
            effective default is 500 MiB (`524288000`). ADR-108.
          - `llm_endpoint` (string) — unversioned base URL of the
            Anthropic-compatible Messages API or gateway (for example,
            `https://api.anthropic.com`). Do not include `/v1`. ADR-101.
          - `llm_api_key` (string) — bearer credential the server uses on
            outbound LLM requests. Write-only in admin API responses: once
            configured, GET/PATCH responses return `"<redacted>"` instead of
            the raw key. ADR-101.
          - `llm_model` (string) — model name passed in the Anthropic Messages
            request body. ADR-101.
          - `llm_max_context_tokens` (int) — LLM context window in tokens
            (e.g. `128000`). OO estimates the full request locally with its
            packaged `o200k_base` tokenizer; the configured Provider remains
            authoritative for the actual model limit. ADR-025, ADR-101.
          - `llm_compaction_threshold_tokens` (int) — Py3 compaction headroom
            trigger. Missing disables compaction. When configured,
            `llm_max_context_tokens` is required and the threshold must be
            strictly smaller than that context window. The trigger compares
            `llm_max_context_tokens − local_token_estimate(prompt)` with
            `llm_compaction_threshold_tokens`; summary `max_output_tokens`
            = `threshold − 4000`. At most one eligible compaction stage runs
            before a final request; the endpoint does not need a count-tokens
            route. ADR-025, ADR-028, ADR-101, ADR-126.
          - `llm_max_concurrent_requests` (int) — optional
            in-process semaphore in the shared LLM provider layer. A configured
            `0` means unlimited and creates no semaphore. A positive integer
            caps concurrent in-flight Anthropic Messages calls made through
            the shared provider adapter, including chat, cron, heartbeat,
            compaction, and future autonomous flows. If missing at server
            startup, only the runtime limiter treats it as `0`; no row is
            persisted. ADR-101, ADR-122.
          - `llm_max_output_tokens` (int) — maximum output-token budget passed
            to Anthropic Messages. Missing means the effective value is
            `16384`, which GET returns without seeding a database row. The
            budget includes thinking and visible output, applies to the next
            provider turn, and does not expand the configured context window.
            ADR-101, ADR-125.
          - `default_soul` (string) — global fallback agent identity used when
            the user's personal `SOUL.md` is absent. Personal SOUL takes
            precedence. Changes apply from the next agent turn.
          - `web_fetch_denylist` (string array) — effective canonical SSRF
            denylist for Server-site `web_fetch`. Missing storage uses the
            private/reserved/metadata default. Explicit `[]` permits all
            otherwise-valid HTTP(S) targets. ADR-133.

        Object storage is deployment infrastructure config, like Postgres: it
        is read from environment / deployment secrets at server startup and is
        not exposed through this admin API. `server_mcp` is managed through the
        dedicated `/api/admin/server-mcp` route, not through config patching.

        Python-main accepts `llm_endpoint`, `llm_api_key`, and `llm_model` on PATCH
        after validating the merged provider identity with `GET
        {llm_endpoint}/v1/models`. `GET /api/admin/config` redacts configured
        `llm_api_key` as `"<redacted>"`; callers rotate the key by sending a new
        value and keep the existing key by omitting it. Sending `"<redacted>"` as
        a new secret value is rejected.
      security:
        - cookieAuth: [admin]
        - bearerAuth: [admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminConfig' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Admin]
      summary: Update system-wide config keys
      description: |
        Partial update — keys present are updated, keys absent are untouched.
        Unknown keys, `null` values, empty strings, and unsupported keys such as
        `server_mcp` or `object_storage_*` return `400 Bad Request` and do not
        write any config changes. Quota values must be positive integers.

        When any of `llm_endpoint`, `llm_api_key`, or `llm_model` changes,
        the server validates the provider before writing: `GET
        {llm_endpoint}/v1/models` must be reachable with the configured bearer
        credential, return a well-formed models response accepted by OpenOctopus,
        and include the configured `llm_model`. Validation failure returns
        `400 Bad Request` and leaves the existing DB config unchanged.

        First-time LLM identity setup requires `llm_endpoint`, `llm_api_key`,
        and `llm_model` in the same PATCH. After a valid identity exists,
        later PATCHes may reuse stored values by omitting unchanged identity
        keys. `GET /api/admin/config` and successful PATCH responses redact a
        configured `llm_api_key` as `"<redacted>"`; callers rotate the key by
        sending a new value and keep the existing key by omitting
        `llm_api_key`. Sending `"<redacted>"` as a new key is rejected.

        Python-main treats configured `llm_max_concurrent_requests=0` as
        unlimited/no semaphore and positive integers as an in-process cap for
        outbound Anthropic Messages calls. If the key is missing at startup,
        only the runtime limiter treats it as `0`; no default row is persisted.
        Negative values and values above the server maximum are invalid.

        `llm_max_output_tokens` must be an integer in `1..1000000`. When
        `llm_max_context_tokens` is configured, the merged config must also
        satisfy `llm_max_output_tokens <= llm_max_context_tokens`. A successful
        change is read by the next provider turn and does not mutate an
        already-running call. `llm_compaction_threshold_tokens`, when present,
        must be in `4001..(llm_max_context_tokens - 1)`.

        `web_fetch_denylist`, when present, replaces the complete Server list.
        It accepts at most 256 unique canonical CIDR/IP/hostname/host:port
        entries. URLs, paths, userinfo, wildcard, and regex forms are invalid.
        The whole candidate validates before any field is written; successful
        changes apply to later fetches without restart.

        `default_soul`, when present, replaces the global fallback agent
        identity. It applies from the next agent turn only when the user's
        personal `SOUL.md` is absent; a personal file takes precedence.
      security:
        - cookieAuth: [admin]
        - bearerAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Partial update — keys present are updated, keys absent are untouched.
              properties:
                quota_bytes:
                  { type: integer, format: int64, minimum: 1, example: 524288000, description: Per-user personal workspace quota in bytes. }
                shared_workspace_quota_bytes:
                  { type: integer, format: int64, minimum: 1, example: 524288000, description: Maximum quota for one shared workspace in bytes. }
                llm_endpoint:
                  { type: string, minLength: 1, example: https://api.siliconflow.cn, description: Unversioned Anthropic-compatible API base URL; omit /v1. }
                llm_api_key:
                  { type: string, minLength: 1, example: sk-your-provider-key, description: New provider credential. Omit to retain the current key. }
                llm_model:
                  { type: string, minLength: 1, example: Qwen/Qwen3.5-4B, description: Provider model identifier. }
                llm_max_context_tokens:
                  { type: integer, format: int64, minimum: 1, example: 131072, description: Provider context-window size. }
                llm_compaction_threshold_tokens:
                  { type: integer, format: int64, minimum: 4001, example: 16000, description: Remaining-token headroom that triggers compaction. }
                llm_max_concurrent_requests:
                  { type: integer, format: int64, minimum: 0, maximum: 1000000, example: 8, description: In-flight provider-call cap; zero means unlimited. }
                llm_max_output_tokens:
                  { type: integer, format: int64, minimum: 1, maximum: 1000000, example: 16384, description: Output budget including thinking tokens. }
                default_soul:
                  { type: string, minLength: 1, maxLength: 32000, pattern: '.*\S.*', example: "You are OpenOctopus, the user's personal AI partner.", description: Default agent identity used when a personal SOUL.md is absent. }
                web_fetch_denylist:
                  type: array
                  maxItems: 256
                  uniqueItems: true
                  items: { type: string, minLength: 1, maxLength: 512 }
                  example: [127.0.0.0/8, 169.254.169.254/32]
                  description: Complete canonical Server web_fetch denylist; an empty array permits all otherwise-valid targets.
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminConfig' } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/admin/server-mcp:
    description: Py8a admin shared-service Server MCP configuration and runtime diagnostics.
    get:
      tags: [Admin]
      summary: Read shared Server MCP config, catalog, and runtime state
      description: |
        Returns the authoritative PostgreSQL config revision, redacted complete
        config, last-good four-surface discovery projection, and a matching
        process-local runtime snapshot. Stdio env and remote header keys remain
        visible but every value is `"<redacted>"`. Runtime unavailability is
        degraded state: schemas remain visible and `/health` continues to
        depend only on PostgreSQL and RustFS.

        Each runtime name has separate `active` and `draining` slots so a
        replacement is not overwritten in diagnostics. A deleted name remains
        with `configured=false` only while its old generation is draining.
        Runtime error messages are bounded OpenOctopus-authored text and never
        expose command args, URL query, env/header values, stderr, response
        bodies, or third-party exception data.
      security:
        - cookieAuth: [admin]
        - bearerAuth: [admin]
      responses:
        '200':
          description: Current authoritative config and matching runtime snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerMcpResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Admin]
      summary: Validate and atomically replace all shared Server MCP config
      description: |
        Whole-list replacement with required `base_config_revision`. Stale CAS
        and a same-name generation still draining return
        `409 server_mcp_config_conflict`. The revision is checked before remote
        work and again in the final transaction.

        Every added or effectively modified server completes a real FastMCP
        initialize plus bounded discovery of tools, static resources, resource
        templates, and prompts before anything is saved. Pure deletion does not
        require the removed endpoint to be reachable. A precise no-op neither
        initializes nor increments the revision. Config, next revision, and the
        complete last-good catalog commit in one JSONB envelope before the new
        runtime is published.

        `"<redacted>"` retains an existing secret only for the same name,
        transport, sink, and key; new or changed sinks require real values.
        Existing Device MCP never blocks an admin candidate. A committed Server
        name shadows the same Device namespace, while Server enabled schemas
        consume the Provider MCP budget before deterministic Device selection.
      security:
        - cookieAuth: [admin]
        - bearerAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServerMcpPut' }
      responses:
        '200':
          description: Transitioned authoritative config and runtime snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerMcpResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Stale CAS, draining-generation conflict, Server collision, or Server-only Provider capacity violation; nothing was saved.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: Strict config, secret marker, spawn, initialize, discovery, or catalog validation failed; nothing was saved.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/admin/users:
    description: Python-main admin user management route.
    get:
      tags: [Admin]
      summary: List users (admin only)
      description: |
        Lists user identity rows plus personal server workspace quota state.
        `quota_bytes`, `bytes_used`, and `locked` are flat response fields for
        the user's personal server workspace, derived through `WorkspaceService`;
        they are not columns on `users` and do not aggregate shared workspaces.
        Usage is scanned live after the database transaction closes, with at
        most four scans in flight. If any scan fails, the whole page returns
        the existing storage-unavailable 503 rather than partial or null data.
      security:
        - cookieAuth: [admin]
        - bearerAuth: [admin]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503':
          description: A personal-workspace usage scan failed; no partial page is returned.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/admin/users/{user_id}:
    description: Python-main admin user management route.
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Admin]
      summary: Delete a user (admin only)
      description: |
        Deletes a user through the same durable cleanup-outbox flow as
        `DELETE /api/me`; a post-commit RustFS purge failure is retried and does
        not change the 204 result. Admins may delete themselves unless doing so
        would delete the last admin. If the target is the only remaining admin,
        the server returns `409 Conflict` with code `last_admin_required`.
      security:
        - cookieAuth: [admin]
        - bearerAuth: [admin]
      responses:
        '204': { description: Deleted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Deleting this user would remove the last admin.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: openoctopus_session
      description: HttpOnly; SameSite=Strict JWT cookie set by `/api/auth/login` and `/api/auth/register`. `Secure` is controlled by `OPENOCTOPUS_COOKIE_SECURE`; production deployments should enable it behind TLS, while local dev may omit it.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: For programmatic clients (CLI, scripts). Same JWT as the cookie, just delivered differently (ADR-004).

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, default: 0, minimum: 0 }
    OpenOctopusDevice:
      name: openoctopus_device
      in: query
      required: true
      description: |
        Install site for file operations. `server` names OpenOctopus's built-in
        server workspace; paired device names route to their live `/ws/device`
        connection. Paired-but-offline names remain valid and return
        `tool_device_unreachable` rather than disappearing from the contract.
      schema:
        type: string
        description: "`server` or a paired device name. The per-user merged tool schema supplies the concrete device enum."

  responses:
    BadRequest:
      description: Malformed request.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Missing or invalid authentication.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Authenticated but not authorized for this resource.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource does not exist.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable error code from `openoctopus_server/errors/`.
            Examples: `device_not_found`, `device_invalid_request`,
            `tool_device_unreachable`, `tool_device_busy`,
            `tool_mcp_busy`, `tool_mcp_unavailable`, `tool_mcp_error`,
            `tool_execution_outcome_unknown`,
            `workspace_not_found`, `auth_forbidden`, `workspace_soft_locked`,
            `workspace_upload_too_large`, `workspace_invalid_skill_format`,
            `workspace_transfer_busy`, `workspace_transfer_timeout`,
            `workspace_transfer_integrity_failed`,
            `network_ssrf_blocked`, `tool_ambiguous_edit`,
            `tool_no_match`, `tool_invalid_schedule`, `auth_last_admin_required`,
            `invalid_request`, `session_invalid_request`,
            `session_has_cron_job`,
            `tool_content_conversion_busy`,
            `tool_content_conversion_resource_exceeded`, and
            `tool_content_conversion_failed`. Admin/Device MCP mutation codes
            include `server_mcp_config_conflict`,
            `mcp_name_reserved_by_server`, `mcp_schema_collision`, and
            `mcp_server_schema_limit`.
        message: { type: string }

    User:
      type: object
      required: [id, email, name, is_admin, created_at]
      properties:
        id: { type: string, description: UUID v4. }
        email: { type: string, format: email }
        name: { type: string }
        is_admin: { type: boolean }
        created_at: { type: string, format: date-time }

    AdminConfig:
      type: object
      additionalProperties: false
      required: [quota_bytes, shared_workspace_quota_bytes, llm_endpoint, llm_api_key, llm_model, llm_max_context_tokens, llm_compaction_threshold_tokens, llm_max_concurrent_requests, llm_max_output_tokens, default_soul, web_fetch_denylist]
      description: |
        Admin-visible effective config. Quota keys are always present because
        missing rows default to 500 MiB (`524288000`).
        `llm_max_output_tokens` is always present and defaults to `16384`
        without seeding a row. Other unconfigured LLM keys are returned as null.
        Configured `llm_api_key` is returned as `"<redacted>"`.
      properties:
        quota_bytes:
          type: integer
          format: int64
          example: 524288000
          description: Effective per-user personal workspace quota. Defaults to 500 MiB when no row is configured.
        shared_workspace_quota_bytes:
          type: integer
          format: int64
          example: 524288000
          description: Effective quota ceiling for a single shared workspace. Defaults to 500 MiB when no row is configured.
        llm_endpoint:
          type: [string, "null"]
          example: https://api.siliconflow.cn
          description: Unversioned Anthropic-compatible API base URL; do not include /v1.
        llm_api_key:
          type: [string, "null"]
          example: <redacted>
          description: Null when unset; `"<redacted>"` when configured. The raw value is never returned.
        llm_model:
          type: [string, "null"]
          example: Qwen/Qwen3.5-4B
          description: Provider model identifier.
        llm_max_context_tokens:
          type: [integer, "null"]
          format: int64
          example: 131072
          description: Configured provider context-window size.
        llm_compaction_threshold_tokens:
          type: [integer, "null"]
          format: int64
          example: 16000
          description: Remaining-token headroom that triggers history compaction.
        llm_max_concurrent_requests:
          type: [integer, "null"]
          format: int64
          example: 8
          description: Maximum in-flight provider calls; zero means unlimited.
        llm_max_output_tokens:
          type: integer
          format: int64
          default: 16384
          minimum: 1
          maximum: 1000000
          example: 16384
          description: Effective provider output budget, including thinking and visible output.
        default_soul:
          type: string
          minLength: 1
          maxLength: 32000
          pattern: '.*\S.*'
          example: "You are OpenOctopus, the user's personal AI partner."
          description: Default agent identity used when a personal SOUL.md is absent.
        web_fetch_denylist:
          type: array
          maxItems: 256
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 512 }
          description: Effective canonical Server web_fetch denylist; explicit empty permits all otherwise-valid targets.

    AdminUser:
      type: object
      required: [id, email, name, is_admin, created_at, quota_bytes, bytes_used, locked]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        is_admin: { type: boolean }
        created_at: { type: string, format: date-time }
        quota_bytes:
          type: integer
          format: int64
          description: Personal server workspace quota from `WorkspaceService`.
        bytes_used:
          type: integer
          format: int64
          description: Personal server workspace usage from `WorkspaceService`; not a `users` table column.
        locked:
          type: boolean
          description: Personal server workspace is over quota (`bytes_used > quota_bytes`).

    Session:
      type: object
      additionalProperties: false
      required: [id, user_id, session_key, channel, chat_id, title, last_inbound_at, unread, cancel_requested, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        session_key:
          type: string
          description: Composite key; usually `{channel}:{chat_id}` (ADR-006). Browser sessions use `web:{session_id}` and clients cannot set or rename it.
        channel: { type: string }
        chat_id: { type: string }
        title:
          type: string
          description: Human-facing mutable title. Defaults to `New chat`.
        last_inbound_at:
          type: [string, "null"]
          format: date-time
        unread:
          type: boolean
          description: |
            Derived browser inbox flag. True when this session has
            user-visible messages newer than the server-side `last_read_at`
            marker. Not a live run status and not an unread count.
        cancel_requested: { type: boolean }
        created_at: { type: string, format: date-time }

    Message:
      type: object
      required: [id, session_id, role, message_kind, is_compacted, content, delivery_refs, created_at]
      properties:
        id: { type: string }
        session_id: { type: string }
        role:
          type: string
          enum: [user, assistant]
          description: |
            Provider-wire role derived from `message_kind`; this is a public
            projection convenience, not a stored `messages` database column.
        message_kind:
          type: string
          enum: [human, assistant, tool_result, synthetic_tool_result, synthetic_assistant_error, compaction_summary]
          description: |
            Stored OpenOctopus semantic discriminator for rendering, audit,
            recovery, and provider request folding. `human`, `tool_result`,
            and `synthetic_tool_result` derive provider role `user`; the other
            three kinds derive `assistant`.
        is_compacted:
          type: boolean
          description: |
            If true, the row remains in canonical history/audit but is excluded
            from provider replay and future compaction input. Summary identity
            is represented by `message_kind=compaction_summary`; an active
            summary is false and can later become true when absorbed.
        content:
          type: array
          items: { $ref: '#/components/schemas/ContentBlock' }
          description: |
            Sanitized Anthropic content blocks. Normal `thinking.thinking`
            blocks are returned when present so the frontend can decide whether
            to display them. `thinking.signature` and raw
            `redacted_thinking.data` are omitted from public responses. For
            `message_kind=human`, the exact server-generated first
            `<runtime>` text block is also omitted from this public projection;
            stored/provider content is unchanged.
        delivery_refs:
          type: array
          items: { $ref: '#/components/schemas/MessageDeliveryRef' }
          description: |
            API-only user-visible delivery references produced by the
            `message` tool. These refs are not part of provider replay.
        created_at: { type: string, format: date-time }

    PendingMessage:
      type: object
      required: [id, session_id, content, received_at]
      description: |
        Durable user message accepted while the session runner is active but
        not yet visible to provider replay. On safe-boundary drain, this row is
        inserted into `messages` with the same `id`, so frontends can reconcile
        pending UI state without duplicates.
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        content:
          type: array
          items: { $ref: '#/components/schemas/ContentBlock' }
          description: |
            Sanitized Anthropic user content blocks that will later become the
            `messages.content` value for the drained human message. The exact
            server-generated first `<runtime>` text block is omitted from this
            public projection; the pending database row retains it.
        effort:
          allOf:
            - $ref: '#/components/schemas/Effort'
          nullable: true
          description: Pending per-turn thinking effort, if supplied.
        received_at: { type: string, format: date-time }

    MessagesResponse:
      type: object
      required: [messages, pending_messages, status, active_turn_id, last_message_id, pending_count, has_more_before]
      description: |
        Canonical PostgreSQL-backed chat state. This response never includes
        in-flight token deltas from a running assistant response. The
        `messages` array is cursor-paginated canonical history, including rows
        retained with `is_compacted=true`; provider replay independently
        selects only active rows. The
        `pending_messages` array is the full durable pending queue for this
        session and is not counted against `limit`.
      properties:
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
          description: |
            Persisted canonical messages in chronological order for the
            requested cursor window.
        pending_messages:
          type: array
          items: { $ref: '#/components/schemas/PendingMessage' }
          description: |
            All durable pending user messages for the session, ordered by
            `(received_at, id)`. These are accepted inputs that have not yet
            been drained into provider-visible `messages`.
        status:
          type: string
          enum: [idle, running, failed, abandoned]
          description: Current session/turn state derived from persisted run/lease state.
        active_turn_id:
          type: string
          nullable: true
          description: Running provider-call/tool-batch id when one currently owns the session.
        last_message_id:
          type: string
          nullable: true
          description: Most recent persisted canonical message id in the whole session.
        pending_count:
          type: integer
          minimum: 0
          description: Durable pending user messages waiting for a safe drain boundary.
        has_more_before:
          type: boolean
          description: True when older persisted canonical messages exist before the earliest returned `messages` row.

    PostMessageStreamEvent:
      oneOf:
        - type: object
          required: [type, message_id, disposition, created_session]
          properties:
            type: { type: string, enum: [message_accepted] }
            message_id: { type: string, description: User message id durably accepted by this POST. }
            disposition: { type: string, enum: [started, queued] }
            created_session: { type: boolean, description: Whether this POST implicitly created the web session. }
        - type: object
          required: [type, turn_id, message_ids]
          description: |
            Starts one normal agent-loop provider call. The ID remains active
            through that call's following tool batch, if any. A later call in
            the same ReAct chain emits another event and ID.
          properties:
            type: { type: string, enum: [turn_started] }
            turn_id: { type: string }
            message_ids:
              type: array
              items: { type: string }
              description: |
                Newly promoted user message ids included in this provider call.
                May be empty for a continuation call in the same ReAct chain.
        - type: object
          required: [type, turn_id, channel, text]
          properties:
            type: { type: string, enum: [token_delta] }
            turn_id: { type: string }
            channel: { type: string, enum: [text, thinking] }
            text: { type: string, description: Coalesced best-effort token text. Not persisted and not replayed. }
        - type: object
          required: [type, turn_id, kind, tool_call_id, tool_name]
          description: Introduced by Py3; Py2 never emits this event.
          properties:
            type: { type: string, enum: [tool_progress] }
            turn_id: { type: string }
            kind: { type: string, description: Tool progress phase, for example `tool_started` or `tool_finished`. }
            tool_call_id: { type: string }
            tool_name: { type: string }
        - type: object
          required: [type, turn_id, message]
          description: |
            Idempotent durable message snapshot. The same message ID may appear
            again after the Py6 `message` tool attaches provider-hidden
            `delivery_refs`; consumers upsert by message ID.
          properties:
            type: { type: string, enum: [message_persisted] }
            turn_id: { type: string }
            message: { $ref: '#/components/schemas/Message' }
        - type: object
          required: [type, turn_id, status]
          description: |
            Finishes one provider-call/tool-batch run. This does not necessarily
            close the POST stream: if the ReAct loop continues, a new
            `turn_started` event with a new ID follows.
          properties:
            type: { type: string, enum: [turn_finished] }
            turn_id: { type: string }
            status: { type: string, enum: [completed, failed, cancelled, abandoned] }
            final_message_id:
              type: string
              nullable: true
              description: |
                Last durable message produced by this run: the assistant row
                for a no-tool response, or the final tool-result row after a
                completed tool batch. Null when no durable message was produced.
        - type: object
          required: [type]
          properties:
            type: { type: string, enum: [session_deleted] }
            session_id: { type: string, format: uuid, description: Deleted session id, if available to the closing stream. }
        - type: object
          required: [type, message_id, by_message_id]
          properties:
            type: { type: string, enum: [stream_replaced] }
            message_id: { type: string, description: Accepted queued message id for this closing POST response. }
            by_message_id: { type: string, description: Newer queued message id whose POST response became the live subscriber. }
        - type: object
          required: [type]
          properties:
            type: { type: string, enum: [keepalive] }
            message_id: { type: string, description: Accepted queued message id for this waiting POST response. }

    Effort:
      type: string
      enum: ["off", low, medium, high, xhigh, max]
      description: |
        Optional browser-selected per-turn thinking effort. `null`, omitted, or
        `off` sends `thinking.type=disabled`. Non-off values send
        `thinking.type=adaptive` plus Anthropic `output_config.effort`.

    UserContentBlock:
      description: Browser-writable Anthropic user content block.
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, text]
          properties:
            type: { type: string, enum: [text] }
            text: { type: string, minLength: 1 }
        - type: object
          additionalProperties: false
          required: [type, source]
          properties:
            type: { type: string, enum: [image] }
            source:
              type: object
              additionalProperties: false
              required: [type, media_type, data]
              properties:
                type: { type: string, enum: [base64] }
                media_type: { type: string, enum: [image/jpeg, image/png, image/gif, image/webp] }
                data:
                  type: string
                  minLength: 1
                  description: Base64-encoded image bytes without a data URL prefix.

    ContentBlock:
      description: Anthropic Messages content block. See ADR-059, ADR-101, ADR-117.
      oneOf:
        - type: object
          required: [type, text]
          properties:
            type: { type: string, enum: [text] }
            text: { type: string }
        - type: object
          required: [type, source]
          properties:
            type: { type: string, enum: [image] }
            source:
              type: object
              required: [type, media_type, data]
              properties:
                type: { type: string, enum: [base64] }
                media_type: { type: string, example: image/png }
                data:
                  type: string
                  description: Base64-encoded image bytes, without a data URL prefix.
        - type: object
          required: [type, id, name, input]
          properties:
            type: { type: string, enum: [tool_use] }
            id: { type: string }
            name: { type: string }
            input: { type: object, additionalProperties: true }
        - type: object
          required: [type, tool_use_id, content]
          properties:
            type: { type: string, enum: [tool_result] }
            tool_use_id: { type: string }
            content:
              type: array
              description: |
                Persisted and public history shape. Raw device WebSocket frames
                may submit a string or safe block array, but OpenOctopus
                normalizes persisted `tool_result.content` to safe blocks
                before DB storage, streaming, history, or provider replay.
              items: { $ref: '#/components/schemas/ToolResultContentBlock' }
            is_error: { type: boolean, default: false }
            code:
              type: string
              description: |
                OpenOctopus diagnostic metadata retained in storage and public
                history, then omitted from the strict Anthropic provider block.
        - type: object
          required: [type, thinking]
          properties:
            type: { type: string, enum: [thinking] }
            thinking:
              type: string
              description: Publicly returned sanitized thinking text when present; frontend decides whether to render it.
            signature:
              type: string
              description: Stored internally for provider replay; omitted from public sanitized responses.
        - type: object
          required: [type]
          properties:
            type: { type: string, enum: [redacted_thinking] }
            redacted:
              type: boolean
              description: Public sanitized placeholder. Raw `data` is stored internally only.

    ToolResultContentBlock:
      description: |
        Safe content block allowed inside normalized tool_result.content arrays
        and raw device tool_result frames. For real tool outputs, OpenOctopus
        prepends a server-generated text warning block before the raw result
        blocks; base64 image data is never modified.
      oneOf:
        - type: object
          required: [type, text]
          properties:
            type: { type: string, enum: [text] }
            text: { type: string }
        - type: object
          required: [type, source]
          properties:
            type: { type: string, enum: [image] }
            source:
              type: object
              required: [type, media_type, data]
              properties:
                type: { type: string, enum: [base64] }
                media_type: { type: string }
                data: { type: string }

    MessageAttachmentRef:
      type: object
      required: [openoctopus_device, path]
      additionalProperties: false
      properties:
        openoctopus_device:
          type: string
          enum: [server]
          description: |
            Browser attachment refs currently target only the authenticated
            user's built-in Server workspace.
        path:
          type: string
          minLength: 1
          maxLength: 4096
          description: |
            Existing virtual workspace path. The message keeps this original
            path and does not move, copy, rename, or delete the object.

    MessageDeliveryRef:
      description: |
        Provider-hidden user delivery metadata. The agent/provider never
        supplies or receives this shape. Py6 accepts a union of durable server
        workspace files and online-only paired-device files.
      oneOf:
        - type: object
          additionalProperties: false
          required: [tool_use_id, type, openoctopus_device, path, workspace_id, workspace_relative_path, filename, mime, size, online_only]
          properties:
            tool_use_id: { type: string }
            type: { type: string, enum: [workspace_file] }
            openoctopus_device: { type: string, enum: [server] }
            path: { type: string }
            workspace_id: { type: string, format: uuid }
            workspace_relative_path: { type: string }
            filename: { type: string }
            mime: { type: string }
            size: { type: integer, format: int64, minimum: 0 }
            online_only: { type: boolean, enum: [false] }
        - type: object
          additionalProperties: false
          required: [tool_use_id, type, device_id, openoctopus_device, path, filename, mime, online_only]
          properties:
            tool_use_id: { type: string }
            type: { type: string, enum: [device_file] }
            device_id:
              type: string
              format: uuid
              description: Immutable paired-device identity used to fence later relay downloads.
            openoctopus_device:
              type: string
              description: Paired device name captured with device_id for the live relay route.
            path: { type: string }
            filename: { type: string }
            mime: { type: string }
            size:
              type: integer
              format: int64
              minimum: 0
              description: Optional client-supplied metadata; message delivery does not open the file to discover it.
            online_only: { type: boolean, enum: [true] }

    Workspace:
      type: object
      required: [id, name, type, quota_bytes, bytes_used, locked]
      properties:
        id:
          type: string
          format: uuid
          description: |
            UUID. For personal workspaces, equals the owner's `users.id`.
            For shared workspaces, the `workspaces.id` row PK (ADR-108).
            Drives the RustFS object prefix: `users/{id}/` for personal
            workspaces and `workspaces/{id}/` for shared workspaces
            (ADR-123).
        name:
          type: string
          description: |
            Display name. For personal workspaces, the owner's `users.name`.
            For shared workspaces, the row's `workspaces.name` — NOT
            globally unique; ADR-109 validation rules apply.
        suffix:
          type: string
          description: |
            Present for shared workspaces. Persisted 8+ hex-character prefix of
            `id`, auto-extended on collision per ADR-108 and stable across
            renames. The agent and REST API address the workspace via the
            `name@suffix` form.
        ref:
          type: string
          description: |
            Present for shared workspaces. The fully-composed `name@suffix`
            addressing form, ready to drop into a tool path or URL.
            Example: `Xmas gift@a4f7e2d1`. The frontend uses this verbatim
            for `/api/workspaces/{workspace_ref}` URLs.
        type: { type: string, enum: [personal, shared] }
        quota_bytes: { type: integer, format: int64 }
        bytes_used: { type: integer, format: int64 }
        locked: { type: boolean, description: bytes_used > quota_bytes. }
        created_by:
          type: [string, "null"]
          format: uuid
          description: |
            Present for shared workspaces. NULL if the creator's account was
            deleted but the workspace still has other members (ADR-108
            exception to ADR-058's cascade rule).
        members:
          type: array
          description: Present for shared-workspace create/get/patch responses; omitted from workspace collection summaries. Use the paginated members route for full lists.
          items: { $ref: '#/components/schemas/WorkspaceMember' }

    WorkspacePage:
      type: object
      additionalProperties: false
      required: [items, limit, offset, next_offset, truncated]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Workspace' }
        limit: { type: integer, minimum: 1, maximum: 1000 }
        offset: { type: integer, minimum: 0 }
        next_offset: { type: [integer, "null"], minimum: 0 }
        truncated: { type: boolean, description: True only when a hard internal safety ceiling stopped the collection. }

    WorkspaceMember:
      type: object
      required: [user_id, email, name]
      properties:
        user_id: { type: string }
        email: { type: string, format: email }
        name: { type: string }

    WorkspaceMemberPage:
      type: object
      additionalProperties: false
      required: [items, limit, offset, next_offset, truncated]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WorkspaceMember' }
        limit: { type: integer, minimum: 1, maximum: 1000 }
        offset: { type: integer, minimum: 0 }
        next_offset: { type: [integer, "null"], minimum: 0 }
        truncated: { type: boolean, description: True only when a hard internal safety ceiling stopped the collection. }

    Device:
      type: object
      additionalProperties: false
      required: [id, name, restrict_to_workspace, workspace_path, ssrf_denylist, shell_timeout_max, env_allowlist, config_revision, mcp_config_count, mcp_enabled_capability_count, mcp_provider_visible_capability_count, mcp_suppressed_capability_count, mcp_catalog_digest, online, token_hint, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: Immutable internal device identifier; never used as a bearer credential.
        name:
          type: string
          description: |
            Canonical per-user slug used in REST paths and tool routing.
            Matches `^[a-z0-9]+(-[a-z0-9]+)*$`, is at most 64 characters,
            and must not be `server`.
        workspace_path:
          type: string
          description: |
            May contain a leading `~`; the client expands at startup.
            Default `~/openoctopus/workspace` (ADR-111) on every OS when not
            supplied at create time. Explicit overrides are stored verbatim.
        restrict_to_workspace:
          type: boolean
          description: |
            Limits OpenOctopus-resolved Client paths and initial exec/PTY cwd
            to `workspace_path`. It is not an OS sandbox or network policy.
        ssrf_denylist:
          type: array
          maxItems: 256
          items: { type: string, minLength: 1, maxLength: 512 }
        shell_timeout_max:
          type: integer
          minimum: 0
          maximum: 86400
          description: Maximum hard lifetime in seconds for client `exec`.
        env_allowlist:
          type: array
          maxItems: 64
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 128 }
          description: Exact environment names inherited by exec children.
        config_revision:
          type: integer
          format: int64
          minimum: 1
        mcp_config_count:
          type: integer
          minimum: 0
          maximum: 16
        mcp_enabled_capability_count:
          type: integer
          minimum: 0
          description: Enabled entries selected by this Device's own config, before Server-derived suppression.
        mcp_provider_visible_capability_count:
          type: integer
          minimum: 0
          description: Enabled Device catalog entries visible in the current owner Provider snapshot.
        mcp_suppressed_capability_count:
          type: integer
          minimum: 0
          description: Enabled Device catalog entries suppressed by Server namespace, exact final-name collision, or Provider capacity. Visible plus suppressed equals enabled.
        mcp_catalog_digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        online:
          type: boolean
          description: |
            Derived from the in-memory device WebSocket registry. There are no
            `online` or `last_seen_at` columns in the database.
        token_hint:
          type: string
          description: |
            Non-secret prefix/suffix hint generated when the token is issued;
            plaintext tokens are not returned by list/update/delete responses.
        created_at: { type: string, format: date-time }

    ChannelConfigView:
      type: object
      required: [channel, configured, config]
      properties:
        channel:
          type: string
          enum: [discord, telegram]
        configured:
          type: boolean
          description: True when the user's per-platform config row exists.
        config:
          oneOf:
            - $ref: '#/components/schemas/DiscordConfig'
            - $ref: '#/components/schemas/TelegramConfig'
            - type: "null"
          description: Platform-specific config view, or null when not configured.

    ChannelConfigPatch:
      oneOf:
        - $ref: '#/components/schemas/DiscordConfigPatch'
        - $ref: '#/components/schemas/TelegramConfigPatch'
      description: |
        Platform-specific partial update body. The path parameter chooses which
        platform parser is used; this oneOf documents the supported shapes.

    DiscordConfig:
      type: object
      required: [bot_token_hint, partner_chat_id, allow_list]
      additionalProperties: false
      properties:
        bot_token_hint:
          type: string
          description: Display-only secret hint, e.g. first visible chars + `...` + last visible chars. Never accepted for authentication or update.
        partner_chat_id: { type: string }
        allow_list:
          type: array
          items: { type: string }
          description: |
            Heterogeneous list of Discord-snowflake-shaped strings. An entry can
            be a User ID (the user is allowed to DM/@-mention), a Channel ID
            (every member of that channel can @-mention the bot in that channel),
            or a Guild ID (every member of that guild can @-mention the bot
            anywhere in the guild). The adapter classifies each entry by Discord
            API lookup at receive time. Inbound is allowed if sender_id matches
            a User entry OR the message-context (channel/guild) matches a
            Channel/Guild entry. Allowed messages still get the
            `[untrusted message from <name>]:` wrap (ADR-007); only the partner
            is unwrapped.

    DiscordConfigPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        bot_token:
          type: string
          description: New Discord bot token. Omit to keep the current token; `"<redacted>"` is rejected.
        partner_chat_id:
          type: string
          description: Partner Discord user/chat id. Changing it triggers a pairing message before persistence.
        allow_list:
          type: array
          items: { type: string }
          description: Whole-array replacement. Entries get schema/length validation only.

    TelegramConfig:
      type: object
      required: [bot_token_hint, partner_chat_id, allow_list]
      additionalProperties: false
      properties:
        bot_token_hint:
          type: string
          description: Display-only secret hint, e.g. first visible chars + `...` + last visible chars. Never accepted for authentication or update.
        partner_chat_id: { type: string }
        allow_list:
          type: array
          items: { type: string }
          description: |
            Heterogeneous list of Telegram identifiers. An entry can be a User ID
            (DM allowed), a group Chat ID (every group member can @-mention the
            bot in the group), or a broadcast Channel ID (per Telegram's
            bot-in-channel API rules). Match logic identical to Discord's
            `allow_list`; allowed messages still get the untrusted wrap.

    TelegramConfigPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        bot_token:
          type: string
          description: New Telegram bot token. Omit to keep the current token; `"<redacted>"` is rejected.
        partner_chat_id:
          type: string
          description: Partner Telegram chat id. Changing it triggers a pairing message before persistence.
        allow_list:
          type: array
          items: { type: string }
          description: Whole-array replacement. Entries get schema/length validation only.

    CronJob:
      type: object
      required: [id, user_id, session_id, name, schedule, message, next_fire_at, created_at]
      properties:
        id: { type: string }
        user_id: { type: string }
        session_id:
          type: string
          description: Dedicated cron session id; its session_key is `cron:{job_id}`.
        name:
          type: string
          description: Short user-facing label.
        schedule:
          type: string
          description: Canonical schedule string after server-side parsing.
        tz:
          type: [string, "null"]
          description: IANA timezone used for cron expressions or naive one-shot timestamps.
        message:
          type: string
          description: Synthesized user message injected into the cron session when the job fires.
        one_shot: { type: boolean }
        last_fired_at: { type: [string, "null"], format: date-time }
        next_fire_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    TransferRequest:
      type: object
      additionalProperties: false
      required: [openoctopus_src_device, src_path, openoctopus_dst_device, dst_path, mode]
      description: |
        Mirrors the `file_transfer` tool's args. Every server/paired-Device
        combination is valid, including two distinct paired Clients owned by
        the authenticated user. Client endpoints must be online when the
        transfer starts. The source may be one regular file or one directory;
        source kind is detected automatically and a directory is recursive.
        Links, reparse points, and special files reject the operation. Empty
        source directories are rejected, and copied directories do not recreate
        empty subdirectories. The reserved `openoctopus_` prefix on the two
        device fields matches the agent-visible tool schema. Existing
        destination roots are rejected without overwrite or merge. There are
        deliberately no `recursive` or `overwrite` fields.
      properties:
        openoctopus_src_device:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^(?:server|[a-z0-9]+(?:-[a-z0-9]+)*)$'
          description: "`server` or a canonical device name."
        src_path:
          type: string
          minLength: 1
          maxLength: 4096
        openoctopus_dst_device:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^(?:server|[a-z0-9]+(?:-[a-z0-9]+)*)$'
          description: "`server` or a canonical device name. Must not already exist at dst_path."
        dst_path:
          type: string
          minLength: 1
          maxLength: 4096
        mode: { type: string, enum: [copy, move] }

    TransferResponse:
      oneOf:
        - { $ref: '#/components/schemas/FileTransferResponse' }
        - { $ref: '#/components/schemas/DirectoryTransferResponse' }
      discriminator:
        propertyName: kind
        mapping:
          file: '#/components/schemas/FileTransferResponse'
          directory: '#/components/schemas/DirectoryTransferResponse'
      description: |
        Bounded aggregate result. For `kind=file`, `files_transferred` is 1 and
        `sha256` is the file-content digest. For `kind=directory`, the count is
        1..10000 and `sha256` is the canonical mapped regular-file path/content
        tree digest; it excludes empty directories and filesystem metadata. No
        per-entry result array is returned.

    FileTransferResponse:
      type: object
      additionalProperties: false
      required: [bytes_transferred, sha256, warnings, kind, files_transferred]
      properties:
        kind:
          type: string
          const: file
        files_transferred:
          type: integer
          const: 1
        bytes_transferred:
          type: integer
          format: int64
          minimum: 0
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        warnings:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            enum: [transfer_ack_failed, source_delete_failed, source_changed_after_copy, source_cleanup_incomplete]
          description: |
            Deduplicated canonical-order non-fatal issues after the complete
            destination is known finalized. They describe an unconfirmed
            source ACK or incomplete conditional source cleanup. Inability to
            prove cleanup of an incomplete destination is instead a 409
            `tool_execution_outcome_unknown` error, never a success warning.

    DirectoryTransferResponse:
      type: object
      additionalProperties: false
      required: [bytes_transferred, sha256, warnings, kind, files_transferred]
      properties:
        kind:
          type: string
          const: directory
        files_transferred:
          type: integer
          minimum: 1
          maximum: 10000
        bytes_transferred:
          type: integer
          format: int64
          minimum: 0
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        warnings:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            enum: [transfer_ack_failed, source_delete_failed, source_changed_after_copy, source_cleanup_incomplete]
          description: |
            Deduplicated canonical-order non-fatal issues after the complete
            destination is known finalized. They describe an unconfirmed
            source ACK or incomplete conditional source cleanup. Inability to
            prove cleanup of an incomplete destination is instead a 409
            `tool_execution_outcome_unknown` error, never a success warning.

    FileMutation:
      type: object
      additionalProperties: false
      required: [path, size, etag, created]
      properties:
        path: { type: string, description: Authorized virtual workspace path. }
        size: { type: integer, format: int64, minimum: 0 }
        etag: { type: string, description: Opaque unquoted revision value. }
        created: { type: boolean }
        replacements:
          type: integer
          minimum: 0
          description: Present only for text-edit responses.

    ListDirEntry:
      type: object
      additionalProperties: false
      required: [name, path, kind, size]
      properties:
        name: { type: string, description: Entry name (basename). }
        path: { type: string, description: 'Authorized virtual path; relative for personal requests and absolute `name@suffix` for shared requests.' }
        kind: { type: string, enum: [file, directory, symlink, other] }
        size: { type: integer, format: int64, description: File byte length; zero for non-files. }

    ListDirEntryPage:
      type: object
      additionalProperties: false
      required: [items, limit, offset, next_offset, truncated]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ListDirEntry' }
        limit: { type: integer, minimum: 1, maximum: 1000 }
        offset: { type: integer, minimum: 0 }
        next_offset: { type: [integer, "null"], minimum: 0 }
        truncated: { type: boolean, description: True when the 10,000-object scan ceiling stopped the search. }

    PatchEditResult:
      type: object
      additionalProperties: false
      required: [path, action, size, etag, created, replacements]
      properties:
        path: { type: string, description: Authorized virtual workspace path. }
        action: { type: string, enum: [replace, add] }
        size: { type: integer, format: int64, minimum: 0 }
        etag: { type: string, description: Opaque unquoted revision value, or `dry-run` in a dry-run response. }
        created: { type: boolean }
        replacements: { type: integer, minimum: 0 }

    StructuredPatchResponse:
      type: object
      additionalProperties: false
      required: [items, dry_run, committed]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PatchEditResult' }
        dry_run: { type: boolean }
        committed:
          type: integer
          minimum: 0
          maximum: 20
          description: Zero for a dry run; otherwise the number of edits committed.

    GrepContextLine:
      type: object
      additionalProperties: false
      required: [line_number, line]
      properties:
        line_number: { type: integer, minimum: 1 }
        line: { type: string }

    GrepResult:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path: { type: string, description: Authorized virtual workspace path. }
        line_number: { type: integer, minimum: 1 }
        line: { type: string }
        count: { type: integer, minimum: 0 }
        before:
          type: array
          items: { $ref: '#/components/schemas/GrepContextLine' }
        after:
          type: array
          items: { $ref: '#/components/schemas/GrepContextLine' }

    GrepResultPage:
      type: object
      additionalProperties: false
      required: [items, limit, offset, next_offset, truncated]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GrepResult' }
        limit: { type: integer, minimum: 1, maximum: 1000 }
        offset: { type: integer, minimum: 0 }
        next_offset: { type: [integer, "null"], minimum: 0 }
        truncated: { type: boolean, description: True when the 10,000-object scan ceiling stopped the search. }

    McpServerConfig:
      oneOf:
        - $ref: '#/components/schemas/StdioMcpServerConfig'
        - $ref: '#/components/schemas/StreamableHttpMcpServerConfig'
        - $ref: '#/components/schemas/SseMcpServerConfig'
      discriminator:
        propertyName: transport
        mapping:
          stdio: '#/components/schemas/StdioMcpServerConfig'
          streamable_http: '#/components/schemas/StreamableHttpMcpServerConfig'
          sse: '#/components/schemas/SseMcpServerConfig'
      description: |
        Py7 Device MCP tagged union. All four discovered surfaces use final
        names `mcp_<server>_<alias>`; the name does not encode the surface.
        Py8a Server MCP uses the separate Server-only union that adds
        `max_concurrent_calls`; Device input never accepts that field.

    McpEnabledCapabilities:
      type: [array, "null"]
      maxItems: 512
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[a-zA-Z0-9_-]{1,64}$'
      description: |
        `null` or omission enables no discovered capability; `[]` explicitly
        enables all; a non-empty list precisely selects final names across tools,
        static resources, resource templates, and prompts.

    StdioMcpServerConfig:
      type: object
      additionalProperties: false
      required: [name, transport, command]
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,31}$'
        transport: { type: string, enum: [stdio] }
        command:
          type: string
          minLength: 1
          maxLength: 4096
          description: Executable name/path; not a user-parsed shell string.
        args:
          type: array
          maxItems: 64
          items: { type: string, maxLength: 4096 }
        cwd:
          type: [string, "null"]
          minLength: 1
          maxLength: 4096
          description: Absolute or home-rooted directory; independent of workspace restriction.
        env:
          type: object
          maxProperties: 64
          additionalProperties: { type: string }
          description: |
            Secret values, at most 16 KiB UTF-8 each. REST responses replace
            values with `"<redacted>"`; stdio children never receive
            `OPENOCTOPUS_*` variables.
        enabled_capabilities: { $ref: '#/components/schemas/McpEnabledCapabilities' }

    RemoteMcpServerConfigBase:
      type: object
      additionalProperties: false
      required: [name, transport, url]
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,31}$'
        transport: { type: string }
        url:
          type: string
          minLength: 1
          maxLength: 4096
          description: Final HTTP(S) endpoint without userinfo or fragment; redirects are not followed.
        headers:
          type: object
          maxProperties: 64
          additionalProperties: { type: string }
          description: Secret values are redacted in REST; non-empty headers require HTTPS and a WSS Device connection.
        enabled_capabilities: { $ref: '#/components/schemas/McpEnabledCapabilities' }

    StreamableHttpMcpServerConfig:
      allOf:
        - $ref: '#/components/schemas/RemoteMcpServerConfigBase'
        - type: object
          properties:
            transport: { type: string, enum: [streamable_http] }

    SseMcpServerConfig:
      allOf:
        - $ref: '#/components/schemas/RemoteMcpServerConfigBase'
        - type: object
          properties:
            transport: { type: string, enum: [sse] }

    ServerMcpServerConfig:
      oneOf:
        - $ref: '#/components/schemas/ServerStdioMcpServerConfig'
        - $ref: '#/components/schemas/ServerStreamableHttpMcpServerConfig'
        - $ref: '#/components/schemas/ServerSseMcpServerConfig'
      discriminator:
        propertyName: transport
        mapping:
          stdio: '#/components/schemas/ServerStdioMcpServerConfig'
          streamable_http: '#/components/schemas/ServerStreamableHttpMcpServerConfig'
          sse: '#/components/schemas/ServerSseMcpServerConfig'
      description: |
        Py8a admin shared-service config. Input may omit
        `max_concurrent_calls`; successful responses and PostgreSQL storage
        always include its effective value (stdio 1, remote 8).

    ServerStdioMcpServerConfig:
      type: object
      additionalProperties: false
      required: [name, transport, command]
      properties:
        name: { type: string, pattern: '^[a-z][a-z0-9_]{0,31}$' }
        transport: { type: string, enum: [stdio] }
        command:
          type: string
          minLength: 1
          maxLength: 4096
          description: Direct executable argv[0]; no shell parsing. Runs as the Server OS user with no OS sandbox.
        args:
          type: array
          maxItems: 64
          items: { type: string, maxLength: 4096 }
        cwd: { type: [string, "null"], minLength: 1, maxLength: 4096 }
        env:
          type: object
          maxProperties: 64
          additionalProperties: { type: string }
          description: Plaintext on write; every REST response value is `"<redacted>"`. `OPENOCTOPUS_*` is never inherited.
        enabled_capabilities: { $ref: '#/components/schemas/McpEnabledCapabilities' }
        max_concurrent_calls:
          type: integer
          minimum: 1
          maximum: 32
          default: 1

    ServerStreamableHttpMcpServerConfig:
      type: object
      additionalProperties: false
      required: [name, transport, url]
      properties:
        name: { type: string, pattern: '^[a-z][a-z0-9_]{0,31}$' }
        transport: { type: string, enum: [streamable_http] }
        url:
          type: string
          minLength: 1
          maxLength: 4096
          description: Exact HTTP(S) MCP endpoint without userinfo or fragment; redirects are not followed.
        headers:
          type: object
          maxProperties: 64
          additionalProperties: { type: string }
          description: Plaintext on write and redacted in REST; non-empty headers require HTTPS.
        enabled_capabilities: { $ref: '#/components/schemas/McpEnabledCapabilities' }
        max_concurrent_calls:
          type: integer
          minimum: 1
          maximum: 32
          default: 8

    ServerSseMcpServerConfig:
      type: object
      additionalProperties: false
