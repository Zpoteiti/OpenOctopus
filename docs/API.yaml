        args:
          type: array
          maxItems: 64
          items: { type: string, maxLength: 4096 }
        cwd: { type: [string, "null"], minLength: 1, maxLength: 4096 }
        env:
          type: object
          maxProperties: 64
          additionalProperties: { type: string, enum: ["<redacted>"] }
        enabled_capabilities: { $ref: '#/components/schemas/McpEnabledCapabilities' }
        max_concurrent_calls: { type: integer, minimum: 1, maximum: 32 }

    ServerRemoteMcpServerConfigView:
      type: object
      additionalProperties: false
      required: [name, transport, url, headers, enabled_capabilities, max_concurrent_calls]
      properties:
        name: { type: string, pattern: '^[a-z][a-z0-9_]{0,31}$' }
        transport: { type: string, enum: [streamable_http, sse] }
        url: { type: string, minLength: 1, maxLength: 4096 }
        headers:
